<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나만의 단어장</title>
<meta name="theme-color" content="#24427C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="나만의 단어장">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Sans+JP:wght@400;500&family=Shippori+Mincho:wght@500;700&display=swap">
<style>
/* Layout: app shell — header, one scrolling content column (max 760px), tab bar pinned to the bottom edge; detail pages stack over the tabs with a back bar. */
:root {
  --bg: #EDF0F4;
  --surface: #FFFFFF;
  --sunken: #F4F6F9;
  --ink: #18202E;
  --muted: #5A6476;
  --line: #D3D9E2;
  --accent: #24427C;
  --accent-ink: #FFFFFF;
  --accent-soft: #E0E7F4;
  --star: #C98A0B;
  --again: #B93A28;
  --hard: #A86A12;
  --good: #2C7A4B;
  --easy: #2766A8;
  --c-new: #2766A8;
  --c-learn: #B93A28;
  --c-rev: #2C7A4B;
  --shadow: 0 1px 2px rgba(24,32,46,.06), 0 8px 24px rgba(24,32,46,.06);
  --f-word: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --f-ui: "IBM Plex Sans KR", "Noto Sans JP", "Apple SD Gothic Neo", system-ui, sans-serif;
  --f-jp: "Noto Sans JP", "Hiragino Sans", "IBM Plex Sans KR", sans-serif;
  --tabbar-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10141B; --surface: #192029; --sunken: #141A22; --ink: #E6EAF1; --muted: #9AA4B6; --line: #2B3442;
    --accent: #8EAEEC; --accent-ink: #0F1724; --accent-soft: #222F47; --star: #E8B341;
    --again: #EE7A66; --hard: #DFA64C; --good: #69C38C; --easy: #78ADEA;
    --c-new: #78ADEA; --c-learn: #EE7A66; --c-rev: #69C38C;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10141B; --surface: #192029; --sunken: #141A22; --ink: #E6EAF1; --muted: #9AA4B6; --line: #2B3442;
  --accent: #8EAEEC; --accent-ink: #0F1724; --accent-soft: #222F47; --star: #E8B341;
  --again: #EE7A66; --hard: #DFA64C; --good: #69C38C; --easy: #78ADEA;
  --c-new: #78ADEA; --c-learn: #EE7A66; --c-rev: #69C38C;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-ui); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  margin: 0;
  padding-top: calc(18px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(var(--tabbar-h) + 32px + env(safe-area-inset-bottom, 0px));
}
body.no-tabs { padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px)); }
.app { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
h2, h3 { text-wrap: balance; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; }
.hanko { width: 38px; height: 38px; border-radius: 8px; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-family: var(--f-word); font-weight: 700; font-size: 21px; line-height: 1; }
.brand h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
.brand p { margin: 0; font-size: 12px; color: var(--muted); }
.sync { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.sync[data-kind="db"]::before { background: var(--good); }
.sync[data-kind="local"]::before { background: var(--good); }

/* page bar for stacked pages */
.pagebar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.pagebar .left { display: flex; align-items: center; gap: 10px; min-width: 0; }
.pagebar h2 { margin: 0; font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* generic */
.section-title { margin: 0 0 10px; font-size: 12px; font-weight: 600; letter-spacing: .08em; color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; }
.stack { display: grid; gap: 18px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 16px; font-weight: 500; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:disabled { background: var(--accent-soft); border-color: var(--accent-soft); color: var(--muted); }
.btn.ghost { background: transparent; }
.btn.small { padding: 6px 12px; font-size: 13.5px; }
.btn.danger { background: var(--again); border-color: var(--again); color: var(--surface); }
.empty { margin: 0; color: var(--muted); }
.note { font-size: 13px; color: var(--muted); margin: 0; }

/* tab bar */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.tabbar-inner { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); height: var(--tabbar-h); }
.tab { border: 0; background: transparent; display: grid; place-items: center; align-content: center; gap: 2px; font-size: 11.5px; color: var(--muted); }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--accent); font-weight: 600; }

/* decks */
.decks { display: flex; flex-direction: column; gap: 12px; }
.deck { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; display: grid; gap: 14px; box-shadow: var(--shadow); }
.deck-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.deck h3 { margin: 0; font-size: 18px; font-weight: 600; }
.deck-meta { margin: 0; font-size: 13px; color: var(--muted); }
.bar { height: 4px; background: var(--accent-soft); border-radius: 2px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.counts { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; margin: 0; }
.counts div { background: var(--sunken); border-radius: 10px; padding: 8px 12px; }
.counts dt { font-size: 12px; color: var(--muted); }
.counts dd { margin: 0; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.c-new dd { color: var(--c-new); } .c-learn dd { color: var(--c-learn); } .c-rev dd { color: var(--c-rev); }
.deck-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.confirm { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13.5px; }

/* tools */
.tools { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 560px) { .tools { grid-template-columns: 1fr; } }
.tools .panel { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.tools h2 { margin: 0; font-size: 15px; font-weight: 600; }
.tools p { margin: 0; font-size: 13px; color: var(--muted); }
#importFile, #backupFile, #gridFile { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.import-msg { font-size: 13px; }
.import-msg[data-kind="error"] { color: var(--again); }
.stepper { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 10px; padding: 3px; align-self: flex-start; }
.stepper button { width: 36px; height: 34px; border: 0; background: transparent; border-radius: 8px; font-size: 18px; }
.stepper button:hover { background: var(--accent-soft); }
.stepper output { min-width: 44px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; align-self: flex-start; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; border-radius: 8px; padding: 6px 12px; font-size: 13.5px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

/* search + chips */
.searchrow { display: flex; gap: 8px; align-items: center; }
.search { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 14px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }

/* word list */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.row { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 12px 16px; }
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--sunken); }
.row .w { font-family: var(--f-jp); font-size: 17px; font-weight: 500; }
.row .w mark { background: none; color: var(--accent); font-weight: 700; }
.row .r { font-family: var(--f-jp); font-size: 13px; color: var(--muted); margin-left: 8px; }
.row .m { font-size: 13.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .star { color: var(--star); font-size: 15px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dot.s-learn { background: var(--c-learn); } .dot.s-rev { background: var(--c-rev); } .dot.s-long { background: var(--accent); }
.more { display: flex; justify-content: center; }

/* kanji grid */
.kgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.ktile { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 6px 8px; display: grid; justify-items: center; gap: 2px; }
.ktile:hover { border-color: var(--accent); }
.ktile .k { font-family: var(--f-word); font-weight: 700; font-size: 32px; line-height: 1.15; }
.ktile .ko { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.ktile .n { font-size: 11px; color: var(--accent); font-variant-numeric: tabular-nums; }

/* word page */
.hero { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 24px; display: grid; gap: 14px; }
.hero-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.hero .word { font-family: var(--f-word); font-weight: 700; font-size: clamp(2.4rem, 8vw, 3.6rem); line-height: 1.2; overflow-wrap: anywhere; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; width: 38px; height: 38px; display: inline-grid; place-items: center; flex: none; color: var(--muted); }
.iconbtn:hover { color: var(--accent); border-color: var(--accent); }
.iconbtn[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.iconbtn svg { width: 18px; height: 18px; }
.reading { font-family: var(--f-jp); font-size: 21px; font-weight: 500; color: var(--accent); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.meaning { font-size: 18px; font-weight: 500; }
.meaning i { font-style: normal; color: var(--muted); font-size: 15px; font-weight: 400; }
.pos { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.decktag { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin-left: 6px; }
.example { background: var(--sunken); border-radius: 12px; padding: 12px 14px; display: grid; gap: 4px; }
.example .jp { font-family: var(--f-jp); font-size: 16.5px; line-height: 1.8; display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; }
.example .jp b { color: var(--accent); font-weight: 600; }
.example .ko { font-size: 14px; color: var(--muted); }
.kj { cursor: pointer; border-bottom: 1px dotted var(--muted); }
.kj:hover, .kj:focus-visible { color: var(--accent); border-bottom-color: var(--accent); }
.kbreak { display: grid; gap: 8px; }
.kitem { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 14px; align-items: center; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 14px 8px 8px; text-align: left; width: 100%; }
.kitem:hover { border-color: var(--accent); }
.kitem .k { font-family: var(--f-word); font-weight: 700; font-size: 34px; line-height: 1; display: grid; place-items: center; height: 52px; background: var(--sunken); border-radius: 8px; }
.kitem .ko { font-weight: 600; }
.kitem .sub { font-size: 12.5px; color: var(--muted); }
.kitem .kohead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.jlpt { font-size: 11px; font-weight: 700; letter-spacing: .03em; padding: 1px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.jlpt.none { background: var(--sunken); color: var(--muted); font-weight: 500; }
.kitem .go { color: var(--muted); font-size: 18px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin: 0; }
.facts div { background: var(--sunken); border-radius: 10px; padding: 9px 12px; }
.facts dt { font-size: 12px; color: var(--muted); }
.facts dd { margin: 0; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }

/* kanji page */
.khero { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 22px; align-items: center; }
@media (max-width: 480px) { .khero { grid-template-columns: 1fr; justify-items: start; } }
.kbig { font-family: var(--f-word); font-weight: 700; font-size: 104px; line-height: 1; width: 148px; height: 148px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 16px; background:
  linear-gradient(var(--line), var(--line)) center/1px 100% no-repeat,
  linear-gradient(var(--line), var(--line)) center/100% 1px no-repeat, var(--sunken); }
.kko { font-size: 24px; font-weight: 600; margin: 0; }
.kchips { display: flex; gap: 6px; flex-wrap: wrap; }
.krow { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; border-bottom: 1px solid var(--line); }
.krow:last-child { border-bottom: 0; }
.krow > .row { border-bottom: 0; }
.kchips.side { justify-content: flex-end; padding: 8px 14px 8px 0; max-width: 55vw; }
@media (max-width: 560px) { .kchips.side .kchip span { display: none; } .kchips.side { gap: 4px; padding-right: 10px; } }
.kchip { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 4px 10px; display: inline-flex; gap: 6px; align-items: baseline; }
.kchip:hover { border-color: var(--accent); }
.kchip b { font-family: var(--f-word); font-size: 20px; }
.kchip span { font-size: 12px; color: var(--muted); }

/* study */
.qcounts { display: flex; gap: 12px; font-weight: 600; font-variant-numeric: tabular-nums; font-size: 15px; }
.qcounts .n { color: var(--c-new); } .qcounts .l { color: var(--c-learn); } .qcounts .r { color: var(--c-rev); }
.qcounts span[data-cur="1"] { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 2px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); min-height: 340px; padding: 28px 24px 24px; display: flex; flex-direction: column; gap: 20px; position: relative; }
.card .tag { position: absolute; top: 14px; left: 18px; font-size: 11.5px; font-weight: 600; letter-spacing: .06em; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); }
.tag.t-new { color: var(--c-new); } .tag.t-learn { color: var(--c-learn); } .tag.t-rev { color: var(--c-rev); }
.card .open { position: absolute; top: 10px; right: 12px; }
.front { flex: 1; display: grid; place-items: center; text-align: center; padding-top: 18px; min-height: 140px; gap: 10px; }
.front .word { font-family: var(--f-word); font-weight: 700; font-size: clamp(2.6rem, 9vw, 4.4rem); line-height: 1.2; letter-spacing: .02em; overflow-wrap: anywhere; }
.front .mfront { font-size: clamp(1.4rem, 5vw, 2rem); font-weight: 600; }
.front .blank { font-family: var(--f-jp); font-size: 16px; color: var(--muted); max-width: 34em; }
.html-front { font-family: var(--f-jp); font-size: clamp(1.6rem, 6vw, 2.6rem); line-height: 1.35; overflow-wrap: anywhere; }
.back { border-top: 1px dashed var(--line); padding-top: 18px; display: grid; gap: 14px; min-width: 0; }
.back .word-inline { font-family: var(--f-word); font-weight: 700; font-size: 34px; }
.html-back { font-family: var(--f-jp); font-size: 16px; line-height: 1.7; overflow-wrap: anywhere; }
.actions { display: grid; gap: 10px; }
.reveal { width: 100%; padding: 16px; font-size: 16px; justify-content: center; }
.rates { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.rate { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 6px 12px; display: grid; gap: 2px; justify-items: center; }
.rate b { font-size: 15.5px; font-weight: 600; }
.rate span { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rate kbd { font-family: var(--f-ui); font-size: 10.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.rate[data-g="1"] b { color: var(--again); } .rate[data-g="1"]:hover { border-color: var(--again); }
.rate[data-g="2"] b { color: var(--hard); }  .rate[data-g="2"]:hover { border-color: var(--hard); }
.rate[data-g="3"] b { color: var(--good); }  .rate[data-g="3"]:hover { border-color: var(--good); }
.rate[data-g="4"] b { color: var(--easy); }
.rates.two { grid-template-columns: 1fr 1fr; gap: 10px; }
.rates.two .rate { padding: 16px 8px; border-radius: 14px; }
.rates.two .rate b { font-size: 17px; }
.rates.two .rate[data-g="3"] span { color: var(--accent); }
.scard { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); padding: 18px 18px 16px; display: flex; flex-direction: column; min-height: min(68vh, 640px); }
.sc-top { display: flex; align-items: center; gap: 8px; }
.sc-top .grow { flex: 1; }
.ago { background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 13px; padding: 5px 12px; border-radius: 999px; white-space: nowrap; }
.favplain { border: 0; background: transparent; color: var(--line); width: 34px; height: 34px; display: grid; place-items: center; padding: 0; }
.favplain svg { width: 22px; height: 22px; }
.favplain[aria-pressed="true"] { color: var(--star); }
.pillbtn { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 8px 14px; display: inline-flex; gap: 6px; align-items: center; font-size: 14px; color: var(--ink); }
.pillbtn svg { width: 18px; height: 18px; }
.pillbtn.tg { color: var(--muted); }
.pillbtn.tg[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
@media (max-width: 420px) { .sc-top { gap: 5px; } .pillbtn { padding: 7px 10px; font-size: 13px; } .ago { padding: 4px 9px; font-size: 12px; } }
.sc-main { flex: 1; display: grid; place-content: center; justify-items: center; text-align: center; gap: 8px; padding: 36px 0 28px; min-height: 250px; }
.sc-reading { font-family: var(--f-jp); color: var(--muted); font-size: 20px; letter-spacing: .04em; }

  const W = [0.40255,1.18385,3.173,15.69105,7.1949,0.5345,1.4604,0.0046,1.54575,0.1192,1.01925,1.9395,0.11,0.29605,2.2698,0.2315,2.9898,0.51655,0.6621];

  const MIN = 60000, DAY = 86400000, LEARN_AHEAD = 20 * MIN;
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const R = (t, s) => Math.pow(1 + FACTOR * t / s, DECAY);
  const ivl = s => clamp(Math.round(s / FACTOR * (Math.pow(0.9, 1 / DECAY) - 1)), 1, 36500);
  const initS = g => Math.max(W[g - 1], 0.1);
  const initD = g => clamp(W[4] - Math.exp(W[5] * (g - 1)) + 1, 1, 10);

    else if (f !== "all") ks = ks.filter(x => String(x.i.jlpt) === f);
    if (q) {
      const qk = toKata(q), ql = q.toLowerCase();
      ks = ks.filter(x => q.includes(x.k) || (x.i.ko || "").includes(q) || (x.i.on || []).some(o => o.includes(qk)) || (x.i.kun || []).some(u => u.replace(/[().\-]/g, "").includes(q)) || (x.i.en || "").toLowerCase().includes(ql));
    }
    if (f === "mine") ks.sort((a, b) => b.n - a.n || (a.i.freq || 9999) - (b.i.freq || 9999));
    else ks.sort((a, b) => (a.i.freq || 9999) - (b.i.freq || 9999) || a.k.localeCompare(b.k));
    const shown = ks.slice(0, S.kanjiLimit);
    const label = f === "mine" ? "단어장에 쓰인 한자" : f === "all" ? "전체 한자" : f === "none" ? "JLPT 급수 외 상용한자" : "N" + f + " 한자";
    const tile = x => {
      const meta = [x.i.jlpt ? "N" + x.i.jlpt : "", x.n ? x.n + "단어" : ""].filter(Boolean).join(" · ");
      return `<button class="ktile" type="button" data-act="kanji" data-k="${esc(x.k)}"><span class="k" lang="ja">${esc(x.k)}</span><span class="ko">${esc(x.i.ko || "—")}</span><span class="n">${meta || "&nbsp;"}</span></button>`;
    };
    return `<p class="note num">${label} ${ks.length}자 · ${f === "mine" ? "단어 많은 순" : "자주 쓰이는 순"}</p>
      ${shown.length ? `<div class="kgrid">${shown.map(tile).join("")}</div>` : '<p class="empty">찾는 한자가 없어요.</p>'}
      ${ks.length > shown.length ? `<div class="more"><button class="btn" type="button" data-act="more-kanji">더 보기 (${ks.length - shown.length}자 남음)</button></div>` : ""}`;
  }

  // ================= view: word page =================
  function kanjiItems(c) {
    const ks = kanjiOf(c.w);
    if (!ks.length) return '<p class="note">이 단어에는 한자가 없어요.</p>';
    return `<div class="kbreak">${ks.map(k => {
      const info = S.kanji[k] || {}, n = (S.kidx.get(k) || []).length;
      const badge = info.jlpt ? `<span class="jlpt">N${info.jlpt}</span>` : info.joyo ? '<span class="jlpt none">급수 외</span>' : "";
      const on = info.on && info.on.length ? `<div class="sub" lang="ja">음 ${esc(info.on.slice(0, 3).join("・"))}</div>` : "";
      const kun = info.kun && info.kun.length ? `<div class="sub" lang="ja">훈 ${esc(info.kun.slice(0, 3).join("・"))}</div>` : "";
      return `<button class="kitem" type="button" data-act="kanji" data-k="${esc(k)}"><span class="k" lang="ja">${esc(k)}</span><span style="min-width:0"><div class="kohead"><span class="ko">${esc(info.ko || "음훈 정보 없음")}</span>${badge}</div>${on}${kun}${on || kun ? "" : `<div class="sub">이 한자가 들어간 단어 ${n}개</div>`}</span><span class="go" aria-hidden="true">›</span></button>`;
    }).join("")}</div>`;
  }
  function noteOf(key) { return S.notes[key] || {}; }
  function myMeaningHtml(key) {
    const x = (noteOf(key).extra || "").trim();
    return x ? `<div class="mymean"><span class="lbl">✎ 내가 추가한 뜻</span><div class="txt">${esc(x)}</div></div>` : "";
  }
  function noteSection(page, c) {
    const n = noteOf(c.key);
    if (page.editNote) {
      return `<section><h2 class="section-title">내 뜻 · 메모 편집</h2>
        <div class="panel noteedit">
          <div class="field"><label for="n_extra">내가 추가한 뜻</label><textarea id="n_extra" placeholder="기본 뜻 아래에 따로 표시돼요. 예: (문어체) 파악해 두다">${esc(n.extra || "")}</textarea></div>
          <div class="field"><label for="n_memo">메모</label><textarea id="n_memo" placeholder="외우는 요령, 헷갈리는 단어, 들었던 문장 등을 자유롭게 적어 두세요.">${esc(n.memo || "")}</textarea></div>
          <div class="formactions"><button class="btn primary" type="button" data-act="note-save">저장</button><button class="btn ghost" type="button" data-act="note-cancel">취소</button></div>

    }
    const memo = (n.memo || "").trim();
    return `<section><div class="pagebar" style="margin-bottom:10px"><h2 class="section-title" style="margin:0">메모</h2><button class="btn small" type="button" data-act="note-edit">✎ 뜻 추가 · 메모 편집</button></div>
      ${memo ? `<div class="memo"><div class="txt">${esc(memo)}</div></div>` : '<p class="note">아직 메모가 없어요. 위 버튼을 눌러 이 단어만의 메모나 내 뜻을 적어 보세요.</p>'}
    </section>`;
  }
  function saveNote(key) {
    const extra = ($("#n_extra") || {}).value || "", memo = ($("#n_memo") || {}).value || "";
    if (extra.trim() || memo.trim()) S.notes[key] = { extra: extra.trim(), memo: memo.trim(), at: Date.now() };
    else delete S.notes[key];
    serial("notes", () => S.store.saveNotes());
  }
  function recordFacts(key) {
    const s = S.states[key], now = Date.now();
    if (!s) return '<p class="note">아직 공부하지 않은 단어예요. 덱에서 공부하기를 누르면 순서대로 나와요.</p>';
    const st = statusOf(key);
    let due;
    if (s.st === "review") { const d = new Date(s.due); due = (d.getMonth() + 1) + "월 " + d.getDate() + "일"; }
    else due = s.due <= now ? "지금" : fmtNext(s, now) + " 뒤";
    const r = s.st === "review" ? Math.round(R(Math.max(0, (now - s.last) / DAY), s.s) * 100) + "%" : "—";
    return `<dl class="facts">
      <div><dt>상태</dt><dd>${st.label}</dd></div>
      <div><dt>다음 복습</dt><dd>${due}</dd></div>
      <div><dt>현재 기억 확률</dt><dd>${r}</dd></div>
      <div><dt>기억 안정도</dt><dd>${s.s >= 1 ? fmtDays(Math.round(s.s)) : "1일 미만"}</dd></div>
      <div><dt>복습 횟수</dt><dd>${s.reps || 0}회</dd></div>
      <div><dt>잊은 횟수</dt><dd>${s.lapses || 0}회</dd></div>
    </dl>`;
  }
  function statusChips(key) {
    const s = S.states[key], st = statusOf(key), now = Date.now();
    let next = "", q = "";
    if (s) {
      if (s.due < nextCutoff(now)) next = "오늘 복습";
      else { const d = Math.round((dayStart(s.due) - dayStart(now)) / DAY); next = d + "일 후 복습"; }
      q = s.due < nextCutoff(now) ? `<button class="wchip" type="button" disabled>오늘 복습 예정</button>` : `<button class="wchip" type="button" data-act="queue" data-key="${esc(key)}">＋ 복습 대기열에 넣기</button>`;
    }
    return `<div class="wchips"><span class="wchip ${st.cls}">● ${st.label}</span>${next ? `<span class="wchip">${next}</span>` : ""}${q}</div>`;
  }
  function simSection(page, c) {
    if (c.html) return "";
    const list = similarCards(c.w, c.key, c.r);
    if (!list.length) return `<section><h2 class="section-title">비슷한 단어</h2><p class="note">같은 한자나 같은 읽기를 쓰는 단어가 아직 없어요.</p></section>`;
    const shown = page.simAll ? list : list.slice(0, 8);
    return `<section><h2 class="section-title">비슷한 단어 ${list.length}개</h2>
      <div class="simlist">${shown.map(x => `<button class="simrow" type="button" data-act="word" data-key="${esc(x.c.key)}">
        <span class="w" lang="ja">${esc(x.c.w)}</span>${x.c.r ? `<span class="r" lang="ja">${esc(x.c.r)}</span>` : ""}
        <span class="m">${esc(x.c.ko)}</span>
        <span class="why">${esc(x.why)} · ${esc(levelLabel(cardLevel(x.c)))} · ${esc(srcName(x.c))}</span>
      </button>`).join("")}</div>
      ${list.length > shown.length ? `<button class="btn small ghost" type="button" data-act="sim-all" style="margin-top:8px">${list.length - shown.length}개 더 보기</button>` : ""}</section>`;
  }
  function viewWord(page) {
    const c = S.byKey[page.key];
    if (!c) return pagebar("단어") + '<p class="empty">이 단어를 찾을 수 없어요.</p>';
    const fav = !!S.favs[c.key];
    const favBtn = `<button class="iconbtn" type="button" data-act="fav" data-key="${esc(c.key)}" aria-pressed="${fav}" aria-label="즐겨찾기">${fav ? ICON.star : ICON.starO}</button>`;
    let body;
    if (c.html) {
      body = `<div class="hero"><div class="hero-top"><div class="word" lang="ja">${linkText(c.w)}</div><div style="display:flex;gap:6px">${speakBtn(c.w)}${favBtn}</div></div>
        <div class="html-back" lang="ja">${sanitize(c.back)}</div>${myMeaningHtml(c.key)}<div><span class="decktag">출처 · ${esc(srcName(c))}</span></div></div>`;
    } else {
      const rg = c.ex ? hlRange(c.ex, c.w, c.pos) : null;
      body = `<div class="hero">
        <div class="wchips"><span class="decktag" style="margin:0">${esc(levelLabel(cardLevel(c)))}</span>${S.states[c.key] ? `<span class="ago">${agoLabel(c.key)}</span>` : ""}</div>
        <div class="hero-top"><div class="word" lang="ja">${linkText(c.w)}</div><div style="display:flex;gap:6px">${speakBtn(c.r || c.w)}${favBtn}</div></div>
        ${c.r ? `<div class="reading" lang="ja">${esc(c.r)}</div>` : ""}
        <div class="meaning">${esc(c.ko)} ${c.en ? `<i>${esc(c.en)}</i>` : ""}</div>
        ${myMeaningHtml(c.key)}
        <div>${c.pos ? `<span class="pos">${esc(c.pos)}</span>` : ""}<span class="decktag">출처 · ${esc(srcName(c))}</span></div>
        ${statusChips(c.key)}
        ${c.ex ? `<div class="example"><div class="jp" lang="ja"><span data-act="speak" data-text="${esc(c.ex)}" style="cursor:pointer">${linkText(c.ex, rg)}</span>${speakBtn(c.ex, "예문 듣기")}</div>${c.exko ? `<div class="ko">${esc(c.exko)}</div>` : ""}</div>` : ""}
      </div>`;
    }
    const right = !c.html ? `<button class="btn small" type="button" data-act="edit" data-key="${esc(c.key)}">편집</button>` : "";
    return `<div class="stack">${pagebar(c.w, right)}${body}
      ${noteSection(page, c)}
      <section><h2 class="section-title">한자</h2>${kanjiItems(c)}</section>
      <section><h2 class="section-title">내 학습 기록</h2>${recordFacts(c.key)}</section>
    </div>`;
  }

  // ================= view: kanji page =================
  function viewKanjiPage(page) {
    const k = page.k, info = S.kanji[k] || {}, keys = S.kidx.get(k) || [];
    const cards = keys.map(key => S.byKey[key]).filter(Boolean);
    const fact = (label, v) => `<div><dt>${label}</dt><dd lang="ja">${v ? esc(v) : '<span class="muted" style="font-weight:400">—</span>'}</dd></div>`;
    const hasDetail = (info.on && info.on.length) || (info.kun && info.kun.length) || info.strokes;
    return `<div class="stack">${pagebar(k + "  " + (info.ko || ""))}
      <div class="hero">
        <div class="khero">
          <div class="kbig" lang="ja">${esc(k)}</div>
          <div style="display:grid;gap:10px;min-width:0">
            <p class="kko">${esc(info.ko || "음훈 정보 없음")}</p>
            <dl class="facts">
              ${fact("음독", (info.on || []).join("・"))}
              ${fact("훈독", (info.kun || []).join("・"))}
              ${fact("획수", info.strokes ? info.strokes + "획" : "")}
              ${fact("JLPT", info.jlpt ? "N" + info.jlpt : (info.joyo ? "급수 외" : ""))}
              ${fact("배우는 시기", info.grade >= 1 && info.grade <= 6 ? "초등 " + info.grade + "학년" : info.grade === 8 ? "중학교 이상" : "")}
              ${fact("영어 뜻", info.en || "")}
            </dl>
            ${info.joyo === false ? '<p class="note">상용한자가 아니에요. 음독·훈독 정보가 없어요.</p>' : hasDetail ? "" : '<p class="note">이 한자의 읽기 정보가 없어요.</p>'}
          </div>
        </div>
      </div>
      <section><h2 class="section-title num">이 한자가 들어간 단어 ${cards.length}개</h2>
        ${cards.length ? `<div class="list">${cards.map(c => kanjiWordRow(c, k)).join("")}</div>` : '<p class="empty">단어장에는 이 한자가 들어간 단어가 없어요.</p>'}
      </section>
    </div>`;
  }

  // ================= view: edit word =================
  const POS = ["명사", "동사·자동사", "동사·타동사", "い형용사", "な형용사", "부사", "접속사", "연체사", "표현", "기타"];
  function openEdit(key) {
    const c = S.byKey[key]; if (!c || c.html) return;
    go({ t: "edit", key: c.key, draft: { w: c.w, r: c.r, pos: c.pos, ko: c.ko, en: c.en, ex: c.ex, exko: c.exko, level: cardLevel(c) } });
  }
  function viewEdit(page) {
    const isNew = !page.key, cur = page.key ? S.byKey[page.key] : null;
    const lv = (page.draft && page.draft.level) || (S.tab === "words" && isNew ? S.wlevel : "mine");
    const del = cur && cur.mine ? (page.confirmDel
      ? `<span class="confirm">이 단어와 복습 기록을 지울까요? <button class="btn danger" type="button" data-act="delword-yes">삭제</button><button class="btn ghost" type="button" data-act="delword-no">취소</button></span>`
      : `<button class="btn ghost" type="button" data-act="delword">단어 삭제</button>`) : "";
    const levelBtns = LEVELS.map(([k, l]) => `<button type="button" data-act="flevel" data-v="${k}" aria-pressed="${lv === k}"><b>${l}</b></button>`).join("");
    return `<div class="stack">${pagebar(isNew ? "단어 추가" : "단어 편집")}
      <div class="editgrid">
      <form class="panel form" id="wordForm" novalidate>
        <div class="field"><label for="f_w">단어 *</label>
          <div class="searchrow"><input id="f_w" class="jpi" type="text" placeholder="예: 把握する" autocomplete="off" required>
          <button class="btn" type="button" data-act="aifill" id="aiBtn">AI로 채우기</button></div>
        </div>
        <div class="field"><label>분류</label><div class="levels levels-sm" role="group" aria-label="분류">${levelBtns}</div><input id="f_level" type="hidden" value="${esc(lv)}"></div>
        <div class="grid2">
          <div class="field"><label for="f_r">읽기</label><input id="f_r" class="jpi" type="text" placeholder="はあくする" autocomplete="off"></div>
          <div class="field"><label for="f_pos">품사</label><select id="f_pos">${POS.map(p => `<option value="${p}">${p}</option>`).join("")}</select></div>
        </div>
        <div class="grid2">
          <div class="field"><label for="f_ko">한국어 뜻 *</label><input id="f_ko" type="text" placeholder="파악하다" autocomplete="off"></div>
          <div class="field"><label for="f_en">영어</label><input id="f_en" type="text" placeholder="to grasp" autocomplete="off"></div>
        </div>
        <div class="field"><label for="f_ex">예문</label><textarea id="f_ex" placeholder="状況を正確に把握することが大切だ。"></textarea></div>
        <div class="field"><label for="f_exko">예문 해석</label><input id="f_exko" type="text" autocomplete="off"></div>
        <div class="field"><label for="f_exf">예문 후리가나 <span class="muted" style="font-weight:400">· AI로 채우기가 같이 채워요. 漢字[かんじ] 형식</span></label><textarea id="f_exf" placeholder="液晶[えきしょう]画面[がめん]は、見[み]にくいなぁ。"></textarea></div>
        <div id="formMsg" class="formmsg" hidden></div>
        <div class="formactions"><button class="btn primary" type="submit">${isNew ? "저장" : "수정 저장"}</button><button class="btn ghost" type="button" data-act="back">취소</button>${del}</div>
        ${cur && !cur.mine ? `<p class="note">'${esc(deckName(cur.deck))}' 덱의 단어를 고치면 이 기기에 저장된 덱 내용이 바뀌어요.</p>` : ""}
      </form>
      <aside class="panel similar" id="similar" aria-live="polite"></aside>
      </div>
      <p class="note">${aiReady() ? "단어를 입력하고 다음 칸으로 넘어가면 AI가 나머지 칸을 자동으로 채워요. 저장하기 전에 한 번 확인해 주세요." : "학습 탭의 'AI 자동 채우기'에 키를 넣으면 단어만 입력해도 나머지 칸이 채워져요."} 새로 추가한 단어는 학습 탭의 '직접 추가한 단어' 덱으로 복습하고, 단어에 쓰인 한자의 페이지에도 연결돼요.</p>
    </div>`;
  }
  const FIELDS = ["w", "r", "pos", "ko", "en", "ex", "exko", "exf", "level"];
  function fillEdit(page) {
    const d = page.draft || {};
    for (const f of FIELDS) { const el = document.getElementById("f_" + f); if (el && d[f] != null && d[f] !== "") el.value = d[f]; }
    const lv = ($("#f_level") || {}).value;
    document.querySelectorAll('[data-act="flevel"]').forEach(b => b.setAttribute("aria-pressed", b.dataset.v === lv));
    if (!page.focused) { page.focused = true; const el = document.getElementById("f_w"); if (el && !d.w) el.focus(); }
    dupCheck();
  }
  function readForm() { const o = {}; for (const f of FIELDS) { const el = document.getElementById("f_" + f); o[f] = el ? el.value.trim() : ""; } return o; }
  function formMsg(text, kind) { const m = $("#formMsg"); if (!m) return; m.hidden = !text; m.textContent = text || ""; if (kind) m.dataset.kind = kind; else m.removeAttribute("data-kind"); }

  // 입력 중인 단어와 겹치거나 같은 한자를 쓰는 기존 단어
  function similarCards(q, selfKey, reading) {
    q = q.trim(); if (!q) return [];
    const ks = kanjiOf(q), qh = toHira(reading || q), out = [];
    for (const c of S.cards) {
      if (c.key === selfKey) continue;
      let score = 0, why = "";
      if (c.w === q) { score = 1000; why = "같은 단어"; }
      else if (q.length >= 2 && (c.w.includes(q) || q.includes(c.w))) { score = 500; why = "단어 일부가 같아요"; }
      else if (c.r && toHira(c.r) === qh) { score = 400; why = "읽기가 같아요"; }
      const shared = ks.filter(k => c.w.includes(k));
      if (shared.length) { score += shared.length * 10; if (!why) why = "같은 한자 " + shared.join("·"); }
      if (score > 0) out.push({ c, score, why });
    }
    return out.sort((a, b) => b.score - a.score || a.c.w.length - b.c.w.length).slice(0, 40);
  }
  function dupCheck() {
    const box = $("#similar"), el = $("#f_w"); if (!box || !el) return;
    const page = topPage(), q = el.value.trim();
    if (!q) { box.innerHTML = '<h2 class="section-title">비슷한 단어</h2><p class="note">단어를 입력하면 이미 있는 단어 중에서 같은 단어나 같은 한자를 쓰는 단어를 여기 보여줘요.</p>'; return; }
    const list = similarCards(q, page && page.key);
    const exact = list.filter(x => x.score >= 1000).length;
    box.innerHTML = `<h2 class="section-title">비슷한 단어 ${list.length}개</h2>
      ${exact ? `<p class="dupwarn">「${esc(q)}」는 이미 있어요. 뜻을 더하려면 아래에서 눌러 바로 고칠 수 있어요.</p>` : ""}
      ${list.length ? `<div class="simlist">${list.map(x => `<button class="simrow ${x.score >= 1000 ? "exact" : ""}" type="button" data-act="dup-open" data-key="${esc(x.c.key)}">
        <span class="w" lang="ja">${esc(x.c.w)}</span>${x.c.r ? `<span class="r" lang="ja">${esc(x.c.r)}</span>` : ""}
        <span class="m">${esc(x.c.ko)}</span>
        <span class="why">${esc(x.why)} · ${esc(levelLabel(cardLevel(x.c)))} · ${esc(srcName(x.c))}</span>
      </button>`).join("")}</div>` : '<p class="note">겹치는 단어가 없어요.</p>'}`;
  }
  async function aiFill(auto) {
    const page = topPage(); if (!page || page.t !== "edit") return;
    page.draft = readForm();
    const w = page.draft.w;

    due.sort((x, y) => S.states[qKey(x, mode)].due - S.states[qKey(y, mode)].due);

  function pickSplit(b, n) { const nd = Math.min(n, b.pool.due.length); return `복습 ${nd}장${n - nd ? ` + 새 카드 ${n - nd}장` : ""}`; }
  function pickSet(page, n) {

  function startSession(page) {

  function agoLabel(key) {

  // 예문 후리가나: 「液晶[えきしょう]画面[がめん]は」 형식. 괄호를 빼면 예문과 같아야 쓴다.
  const FURI_RE = /([々〆ヵヶ㐀-䶿一-鿿豈-﫿]+)\[([^\]]+)\]/g;

  // furi: 후리가나 달기, blank: 단어 자리 비우기(뜻 → 단어에서 정답 보기 전)

  function viewStudy() {

  // ---------- 손글씨 칸 ----------
  let pads = [], strokeOrder = [], penSeen = false;
  function initPads() {
    pads = []; strokeOrder = [];
    document.querySelectorAll(".wcell canvas").forEach((cv, idx) => {
      const pad = { cv, ctx: cv.getContext("2d"), strokes: [], cur: null, size: 0 };
      sizePad(pad);
      cv.addEventListener("pointerdown", e => {
        if (e.pointerType === "pen") penSeen = true;
        if (penSeen && e.pointerType === "touch") return;

        pad.cur = { id: e.pointerId, pts: [] };
        pad.strokes.push(pad.cur); strokeOrder.push(idx);
        addPoint(pad, e);

        for (const ev of (evs.length ? evs : [e])) addPoint(pad, ev);

  function sizePad(pad) {

  }

  function addPoint(pad, e) {
    const r = pad.cv.getBoundingClientRect();
    const pt = { x: e.clientX - r.left, y: e.clientY - r.top, p: e.pointerType === "pen" ? e.pressure : 0 };
    const pts = pad.cur.pts, prev = pts[pts.length - 1];

  // ================= view: stats =================

      case "g-more": gridSyncHeader(); for (let i = 0; i < 10; i++) S.grid.rows.push(newGridRow()); gridRerender(); break;
      case "g-del": { S.grid.rows.splice(+t.dataset.r, 1); if (S.grid.rows.length < 1) S.grid.rows.push(newGridRow()); gridRerender(); break; }
      case "g-clear": gridSyncHeader(); S.grid.rows = Array.from({ length: 10 }, newGridRow); S.grid.tried = false; gridRerender(); gridMsg(""); break;
      case "g-ai": gridAiFill(); break;
      case "g-save": saveGrid(); break;
      case "g-json": gridSyncHeader(); S.pendingImport = null; S.importMsg = null; go({ t: "import" }); break;
      case "imp-level": if (S.pendingImport) { S.pendingImport.name = (($("#imp_name") || {}).value || S.pendingImport.name); S.pendingImport.skip = !!(($("#imp_skip") || {}).checked); S.pendingImport.level = t.dataset.v; render(); } break;
      case "imp-go": doImport(); break;
      case "sources": S.confirmDel = null; S.renaming = null; go({ t: "sources" }); break;
      case "learn-view": S.settings.learnView = t.dataset.v; saveSettingsSoon(); render(); break;
      case "settings": if (!(page && page.t === "settings")) go({ t: "settings" }); break;
      case "src-rename": S.renaming = t.dataset.deck; S.confirmDel = null; render(); { const el = $("#src_name"); if (el) el.focus(); } break;
      case "src-rename-no": S.renaming = null; render(); break;
      case "src-rename-save": { const nm = (($("#src_name") || {}).value || "").trim(); const m = importedMetas.find(x => x.id === t.dataset.deck);
        if (m && nm && !S.decks.some(d => d.name === nm && d.id !== m.id)) { m.name = nm; rebuild(); serial("decks", () => S.store.saveDeck()); S.renaming = null; render(); toast("이름을 바꿨어요."); }
        else toast(nm ? "같은 이름의 출처가 이미 있어요." : "이름을 입력해 주세요."); break; }
      case "edit": openEdit(t.dataset.key); break;
      case "flevel": { const v = t.dataset.v; const h = $("#f_level"); if (h) h.value = v; document.querySelectorAll('[data-act="flevel"]').forEach(b => b.setAttribute("aria-pressed", b.dataset.v === v)); break; }
      case "dup-open": { if (page && page.t === "edit") page.draft = readForm(); const c = S.byKey[t.dataset.key]; if (!c) break; if (c.html) go({ t: "word", key: c.key, editNote: true }); else openEdit(c.key); break; }
      case "export": exportBackup(); break;
      case "aifill": aiFill(false); break;
      case "ai-provider": { const a = readAiForm(); const prev = aiConf(); aiSave({ provider: t.dataset.v, key: t.dataset.v === prev.provider ? a.key : "", model: "" }); render(); break; }
      case "ai-save": { aiSave(readAiForm()); render(); toast(aiReady() ? "AI 키를 저장했어요." : "키를 비웠어요."); break; }
      case "ai-test": aiTest(); break;
      case "ai-clear": aiSave({ provider: aiConf().provider, key: "", model: "" }); render(); toast("키를 지웠어요."); break;
      case "delword": page.draft = readForm(); page.confirmDel = true; render(); break;
      case "delword-no": page.draft = readForm(); page.confirmDel = false; render(); break;
      case "delword-yes": deleteWord(); break;
      case "filter": S.filter = t.dataset.f; S.wordLimit = 100; render(); break;
      case "wlevel": S.wlevel = t.dataset.v; S.wsrc = "all"; S.wordLimit = 100; render(); break;
      case "wsrc": S.wsrc = t.dataset.v; S.wordLimit = 100; render(); break;
      case "more-words": { S.wordLimit += 100; const r = $("#wresults"); if (r) r.innerHTML = wordsResults(); break; }
      case "kfilter": S.kfilter = t.dataset.f; S.kanjiLimit = 240; render(); break;
      case "more-kanji": { S.kanjiLimit += 240; const r = $("#kresults"); if (r) r.innerHTML = kanjiResults(); break; }
      case "npd": setNewPerDay(S.settings.newPerDay + (+t.dataset.d)); break;
      case "dir": { const v = t.dataset.v, m = v === "write" ? "write" : "read";
        if (page && page.t === "pick" && page.mode !== m) { page.mode = m; page.n = null; page.touched = false; }
        S.settings.lastMode = m; if (v !== "write") S.settings.dir = v; saveSettingsSoon(); render(); break; }
      case "deldeck": S.confirmDel = t.dataset.deck; S.renaming = null; render(); break;
      case "deldeck-no": S.confirmDel = null; render(); break;
      case "deldeck-yes": deleteDeck(t.dataset.deck); break;
    }
  });
  document.addEventListener("keydown", e => {
    const t = e.target;
    if (t && t.classList && t.classList.contains("kj") && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); t.click(); return; }
    const page = topPage();
    if (page && page.t === "write" && S.write && !e.metaKey && !e.ctrlKey && !e.altKey && !/INPUT|TEXTAREA|SELECT/.test(t && t.tagName)) {
      if ((e.key === " " || e.key === "Enter") && S.write.cur && !S.write.revealed) { e.preventDefault(); writeReveal(); }
      else if (S.write.cur && (e.key === "1" || e.key === "2")) { e.preventDefault(); sessRate("write", e.key === "2"); }
      else if (e.key === "z") undo();
      return;
    }
    if (!page || page.t !== "study" || !S.study || e.metaKey || e.ctrlKey || e.altKey) return;
    if (/INPUT|TEXTAREA|SELECT/.test(t && t.tagName)) return;
    if ((e.key === " " || e.key === "Enter") && S.study.cur) { e.preventDefault(); S.study.revealed = !S.study.revealed; render(); }
    else if (S.study.cur && (e.key === "1" || e.key === "2")) { e.preventDefault(); sessRate("read", e.key === "2"); }
    else if (e.key === "e" || e.key === "E") { S.settings.hideEx = !S.settings.hideEx; saveSettingsSoon(); render(); }
    else if (e.key === "h" || e.key === "H") { S.settings.showKana = !S.settings.showKana; saveSettingsSoon(); render(); }
    else if (e.key === "z") undo();
  });
  document.addEventListener("input", e => {
    if (e.target.id === "pickRange") { const pg = topPage(); if (pg && pg.t === "pick") pickSet(pg, +e.target.value); return; }
    if (e.target.classList && e.target.classList.contains("gcell") && S.grid) {
      const r = +e.target.dataset.r, k = gcols()[+e.target.dataset.c][0];
      if (S.grid.rows[r]) { S.grid.rows[r][k] = e.target.value; if (k === "w" || k === "ko") gridRefreshStatus(); }
      return;
    }
    if (e.target.id === "wsearch") { S.q = e.target.value; S.wordLimit = 100; const r = $("#wresults"); if (r) r.innerHTML = wordsResults(); }
    else if (e.target.id === "ksearch") { S.kq = e.target.value; S.kanjiLimit = 240; const r = $("#kresults"); if (r) r.innerHTML = kanjiResults(); }
    else if (e.target.id === "f_w") dupCheck();
  });
  // 표 입력: 엑셀처럼 방향키·엔터로 칸 이동 (일본어 입력 중 변환할 때는 건드리지 않음)
  function gridFocus(r, c) {
    const g = S.grid; if (!g) return;
    const ncol = gcols().length;
    c = clamp(c, 0, ncol - 1); if (r < 0) return;
    if (r >= g.rows.length) { gridSyncHeader(); g.rows.push(newGridRow()); gridRerender(); }
    const el = document.querySelector(`.gcell[data-r="${r}"][data-c="${c}"]`); if (!el) return;
    el.focus(); if (el.select) el.select();
    el.scrollIntoView({ block: "nearest", inline: "nearest" });
  }
  document.addEventListener("keydown", e => {
    const t = e.target;
    if (!(t.classList && t.classList.contains("gcell")) || !S.grid || e.isComposing || e.keyCode === 229 || e.altKey || e.metaKey || e.ctrlKey) return;
    const r = +t.dataset.r, c = +t.dataset.c, isSel = t.tagName === "SELECT";
    const atStart = isSel || (t.selectionStart === 0 && t.selectionEnd === 0) || (t.selectionStart === 0 && t.selectionEnd === t.value.length);
    const atEnd = isSel || (t.selectionStart === t.value.length && t.selectionEnd === t.value.length) || (t.selectionStart === 0 && t.selectionEnd === t.value.length);
    let to = null;
    if (e.key === "ArrowUp") to = [r - 1, c];
    else if (e.key === "ArrowDown") to = [r + 1, c];
    else if (e.key === "Enter") to = [e.shiftKey ? r - 1 : r + 1, c];
    else if (e.key === "ArrowLeft" && atStart && !e.shiftKey) to = [r, c - 1];
    else if (e.key === "ArrowRight" && atEnd && !e.shiftKey) to = [r, c + 1];
    if (!to) return;
    e.preventDefault(); e.stopPropagation();
    if (to[1] < 0 || to[1] >= gcols().length) return;
    gridFocus(to[0], to[1]);
  }, true);
  document.addEventListener("paste", e => {
    const t = e.target;
    if (!(t.classList && t.classList.contains("gcell")) || !S.grid) return;
    const text = (e.clipboardData || window.clipboardData).getData("text/plain");
    if (!/[\t\n]/.test(text.replace(/\r?\n$/, ""))) return;
    e.preventDefault();
    let grid = parseDelimited(text.replace(/\r?\n$/, ""), "\t");
    if (grid.length && /^단어\*?$/.test(String(grid[0][0] || "").trim())) grid = grid.slice(1);
    const r0 = +t.dataset.r, c0 = +t.dataset.c;
    grid.forEach((cells, i) => {
      while (S.grid.rows.length <= r0 + i) S.grid.rows.push(newGridRow());
      cells.forEach((v, j) => { const col = gcols()[c0 + j]; if (col) S.grid.rows[r0 + i][col[0]] = col[0] === "lv" ? normLv(v) : String(v).trim(); });
    });
    gridSyncHeader(); gridRerender();
    gridMsg(`${grid.length}줄을 붙여 넣었어요.`);
  });
  $("#gridFile").addEventListener("change", async e => {
    const file = e.target.files && e.target.files[0]; e.target.value = "";
    if (!file || !S.grid) return;
    gridSyncHeader();
    try {
      const buf = await file.arrayBuffer();
      let aoa;
      if (/\.xlsx$/i.test(file.name)) aoa = await readXlsx(buf);
      else { const txt = decodeText(buf).replace(/^\uFEFF/, ""); aoa = parseDelimited(txt, txt.includes("\t") ? "\t" : ","); }
      const rows = sheetToRows(aoa);
      if (!rows.length) return gridMsg("파일에서 단어를 찾지 못했어요. 첫 줄이 '단어, 읽기, 품사, 한국어 뜻…' 제목인지 확인해 주세요.", "error");
      addRowsToGrid(rows); gridRedrawAll();
      gridMsg(`'${file.name}'에서 ${rows.length}개를 표에 넣었어요. 확인하고 추가해 주세요.`);
    } catch (err) { gridMsg("파일을 읽지 못했어요: " + err.message + " (엑셀은 .xlsx로 저장해 주세요)", "error"); }
  });
  document.addEventListener("change", e => {
    if (e.target.classList && e.target.classList.contains("gsel") && S.grid) { const r = +e.target.dataset.r; if (S.grid.rows[r]) S.grid.rows[r].lv = e.target.value; return; }
    if (e.target.id !== "f_w" || !aiReady()) return;
    const f = readForm();
    if (f.w && !f.r && !f.ko && !f.ex) aiFill(true);
  });
  document.addEventListener("submit", e => { if (e.target.id === "wordForm") { e.preventDefault(); saveWordForm(); } });

  function applySettings(o) {
    if (!o) return;
    if (Number.isFinite(o.newPerDay)) S.settings.newPerDay = o.newPerDay;
    if (o.dir) S.settings.dir = o.dir;
    if (Number.isFinite(o.writeNewPerDay)) S.settings.writeNewPerDay = o.writeNewPerDay;
    if (typeof o.showTrans === "boolean") S.settings.showTrans = o.showTrans;
    if (o.learnView === "level" || o.learnView === "source") S.settings.learnView = o.learnView;
    if (o.lastMode === "read" || o.lastMode === "write") S.settings.lastMode = o.lastMode;
    if (Number.isFinite(o.sessSize)) S.settings.sessSize = o.sessSize;
    if (typeof o.hideEx === "boolean") S.settings.hideEx = o.hideEx;
    if (typeof o.showKana === "boolean") S.settings.showKana = o.showKana;
    if (Number.isFinite(o.writeSessSize)) S.settings.writeSessSize = o.writeSessSize;
  }
  let settingsTimer = null;
  function saveSettingsSoon() {
    clearTimeout(settingsTimer);
    settingsTimer = setTimeout(() => { if (S.store) S.store.saveSettings(S.settings).catch(() => toast("설정을 저장하지 못했어요.")); }, 700);
  }
  function setNewPerDay(n) { S.settings.newPerDay = clamp(n, 0, 200); saveSettingsSoon(); render(); }

  async function deleteDeck(id) {
    const d = S.decks.find(x => x.id === id); if (!d || d.builtin) return;
    const keys = d.cards.map(c => c.key);
    for (const k of keys) { delete S.states[k]; delete S.states["wr:" + k]; delete S.favs[k]; }
    importedMetas = importedMetas.filter(m => m.id !== id); S.confirmDel = null;
    if (S.undo && S.undo.deck === id) S.undo = null;
    rebuild(); render();
    try { await S.store.deleteDeck(id, d.meta || {}, keys); toast(`'${d.name}' 덱을 지웠어요.`); } catch (e) { toast("덱을 지우는 중 문제가 생겼어요. 새로고침 후 다시 시도해 주세요."); }
  }

  // ================= CSV import =================
  function parseDelimited(s, sep) {
    const rows = []; let row = [], f = "", q = false;
    for (let i = 0; i < s.length; i++) {
      const c = s[i];
      if (q) { if (c === '"') { if (s[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
      else if (c === '"' && f === "") q = true;
      else if (c === sep) { row.push(f); f = ""; }
      else if (c === "\n") { row.push(f); rows.push(row); row = []; f = ""; }
      else if (c !== "\r") f += c;
    }
    if (f !== "" || row.length) { row.push(f); rows.push(row); }
    return rows;
  }
  function parseImport(text, filename) {
    text = text.replace(/^﻿/, "");
    let sep = null, deck = null, cols = null; const body = [];
    for (const ln of text.split(/\r?\n/)) {
      if (ln.startsWith("#")) { const m = ln.match(/^#([A-Za-z]+):(.*)$/); if (m) { const k = m[1].toLowerCase(), v = m[2].trim(); if (k === "separator") sep = { tab: "\t", comma: ",", semicolon: ";", pipe: "|", space: " " }[v.toLowerCase()] || v; else if (k === "deck") deck = v; else if (k === "columns") cols = v; } continue; }
      body.push(ln);
    }
    const raw = body.join("\n");
    if (!sep) sep = raw.includes("\t") ? "\t" : (raw.includes(";") && !raw.includes(",") ? ";" : ",");
    let fi = 0, bi = 1;
    if (cols) { const names = cols.split(sep).map(x => x.trim().toLowerCase()); if (names.indexOf("front") >= 0) fi = names.indexOf("front"); if (names.indexOf("back") >= 0) bi = names.indexOf("back"); }
    const rows = parseDelimited(raw, sep).filter(r => r.length > Math.max(fi, bi) && r[fi].trim()).map(r => [r[fi].trim(), (r[bi] || "").trim()]);
    const name = (deck ? deck.split("::").pop() : filename.replace(/\.[^.]+$/, "")).trim() || "가져온 덱";
    return { name, rows };
  }
  function readDeckFile(text, filename) {
    const t = text.replace(/^\uFEFF/, "").trim();
    if (/\.json$/i.test(filename) || t.startsWith("{")) {
      const j = JSON.parse(t);
      if (j && j.format === "fsrs-backup") return { error: "이 파일은 기록 백업이에요. '기록 백업 → 가져오기'로 열어 주세요." };
      if (!j || !Array.isArray(j.words)) return { error: "단어장 파일 형식이 아니에요." };
      const rows = j.words.filter(r => Array.isArray(r) && r[0]).map(r => [0, 1, 2, 3, 4, 5, 6].map(i => String(r[i] == null ? "" : r[i])));
      const level = [1, 2, 3, 4, 5].includes(+j.level) ? +j.level : null;
      return { name: String(j.name || filename.replace(/\.[^.]+$/, "")), rows, kind: "words", id: j.id, base: !!(j.base && level), level };
    }
    const p = parseImport(t, filename);
    return { name: p.name, rows: p.rows, kind: "html" };
  }
  $("#importFile").addEventListener("change", async e => {
    const file = e.target.files && e.target.files[0]; e.target.value = "";
    if (!file) return;
    const say = (text, kind) => { S.importMsg = { text, kind }; render(); };
    if (!S.ready) return say("기록을 불러온 뒤에 다시 시도해 주세요.", "error");
    const page = topPage();
    if (!page || page.t !== "import") { S.stack = []; S.tab = "words"; S.stack.push({ t: "import" }); }
    try {
      const r = readDeckFile(await file.text(), file.name);
      if (r.error) { S.pendingImport = null; return say(r.error, "error"); }
      if (!r.rows.length) { S.pendingImport = null; return say("단어로 읽을 줄을 찾지 못했어요. 파일 내용을 확인해 주세요.", "error"); }
      if (r.rows.length > 5000) { S.pendingImport = null; return say("한 번에 5,000개까지 가져올 수 있어요. 파일을 나눠서 가져와 주세요.", "error"); }
      const dups = exactDupCount(r.rows, r.kind);
      S.importMsg = null;
      S.pendingImport = { file: file.name, name: r.name, rows: r.rows, kind: r.kind, id: r.id, level: r.level ? String(r.level) : "mine", dups, skip: dups > 0 };
      render();
    } catch (err) {
      S.pendingImport = null; say("파일을 읽지 못했어요. 형식을 확인한 뒤 다시 시도해 주세요.", "error");
    }
  });

  // ================= backup =================
  async function exportBackup() {
    const data = { format: "fsrs-backup", version: 1, exportedAt: Date.now(), states: S.states, settings: S.settings, words: S.words, favs: S.favs, days: S.days, notes: S.notes, levels: S.levels, decks: importedMetas };
    const name = "나만의단어장-백업-" + dayKey(Date.now()) + ".json";
    const blob = new Blob([JSON.stringify(data)], { type: "application/json" });
    try {
      const file = new File([blob], name, { type: "application/json" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file] });
        return;
      }
    } catch (e) {
      if (e && e.name === "AbortError") return;
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  }
  $("#backupFile").addEventListener("change", async e => {
    const file = e.target.files && e.target.files[0]; e.target.value = "";
    if (!file) return;
    try {
      const j = JSON.parse((await file.text()).replace(/^\uFEFF/, ""));
      if (!j || j.format !== "fsrs-backup") { toast("나만의 단어장 백업 파일이 아니에요."); return; }
      S.states = j.states || {}; S.words = j.words || []; S.favs = j.favs || {}; S.days = j.days || {}; S.notes = j.notes || {}; S.levels = j.levels || {};
      importedMetas = Array.isArray(j.decks) ? j.decks : [];
      applySettings(j.settings);
      S.undo = null; S.stack = []; S.study = null;
      rebuild(); await S.store.saveAll(); render();
      toast("백업에서 기록을 불러왔어요.");
    } catch (err) { toast("백업 파일을 읽지 못했어요."); }
  });

  // ================= boot =================
  async function boot() {
    render();
    try { S.kanji = await fetch("kanji.json").then(r => r.json()); } catch (e) { S.kanji = {}; }
    S.store = LocalStore();
    const data = await S.store.loadAll();
    S.states = data.states || {};
    applySettings(data.settings);
    importedMetas = data.decks || []; S.words = data.words || []; S.favs = data.favs || {}; S.days = data.days || {}; S.notes = data.notes || {}; S.levels = data.levels || {};
    rebuild();
    S.ready = true;
    render();
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    if ("serviceWorker" in navigator) { try { navigator.serviceWorker.register("sw.js"); } catch (e) {} }
  }
  boot();
})();
