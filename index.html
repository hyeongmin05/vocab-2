<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나만의 단어장</title>
<meta name="theme-color" content="#24427C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="나만의 단어장">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Sans+JP:wght@400;500&family=Shippori+Mincho:wght@500;700&display=swap">
<style>
/* Layout: app shell — header, one scrolling content column (max 760px), tab bar pinned to the bottom edge; detail pages stack over the tabs with a back bar. */
:root {
  --bg: #EDF0F4;
  --surface: #FFFFFF;
  --sunken: #F4F6F9;
  --ink: #18202E;
  --muted: #5A6476;
  --line: #D3D9E2;
  --accent: #24427C;
  --accent-ink: #FFFFFF;
  --accent-soft: #E0E7F4;
  --star: #C98A0B;
  --again: #B93A28;
  --hard: #A86A12;
  --good: #2C7A4B;
  --easy: #2766A8;
  --c-new: #2766A8;
  --c-learn: #B93A28;
  --c-rev: #2C7A4B;
  --shadow: 0 1px 2px rgba(24,32,46,.06), 0 8px 24px rgba(24,32,46,.06);
  --f-word: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --f-ui: "IBM Plex Sans KR", "Noto Sans JP", "Apple SD Gothic Neo", system-ui, sans-serif;
  --f-jp: "Noto Sans JP", "Hiragino Sans", "IBM Plex Sans KR", sans-serif;
  --tabbar-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10141B; --surface: #192029; --sunken: #141A22; --ink: #E6EAF1; --muted: #9AA4B6; --line: #2B3442;
    --accent: #8EAEEC; --accent-ink: #0F1724; --accent-soft: #222F47; --star: #E8B341;
    --again: #EE7A66; --hard: #DFA64C; --good: #69C38C; --easy: #78ADEA;
    --c-new: #78ADEA; --c-learn: #EE7A66; --c-rev: #69C38C;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10141B; --surface: #192029; --sunken: #141A22; --ink: #E6EAF1; --muted: #9AA4B6; --line: #2B3442;
  --accent: #8EAEEC; --accent-ink: #0F1724; --accent-soft: #222F47; --star: #E8B341;
  --again: #EE7A66; --hard: #DFA64C; --good: #69C38C; --easy: #78ADEA;
  --c-new: #78ADEA; --c-learn: #EE7A66; --c-rev: #69C38C;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-ui); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  margin: 0;
  padding-top: calc(18px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(var(--tabbar-h) + 32px + env(safe-area-inset-bottom, 0px));
}
body.no-tabs { padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px)); }
.app { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
h2, h3 { text-wrap: balance; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; }
.hanko { width: 38px; height: 38px; border-radius: 8px; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-family: var(--f-word); font-weight: 700; font-size: 21px; line-height: 1; }
.brand h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
.brand p { margin: 0; font-size: 12px; color: var(--muted); }
.sync { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.sync[data-kind="db"]::before { background: var(--good); }
.sync[data-kind="local"]::before { background: var(--good); }

/* page bar for stacked pages */
.pagebar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.pagebar .left { display: flex; align-items: center; gap: 10px; min-width: 0; }
.pagebar h2 { margin: 0; font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* generic */
.section-title { margin: 0 0 10px; font-size: 12px; font-weight: 600; letter-spacing: .08em; color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; }
.stack { display: grid; gap: 18px; }
.stack > * { min-width: 0; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 16px; font-weight: 500; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:disabled { background: var(--accent-soft); border-color: var(--accent-soft); color: var(--muted); }
.btn.ghost { background: transparent; }
.btn.small { padding: 6px 12px; font-size: 13.5px; }
.btn.danger { background: var(--again); border-color: var(--again); color: var(--surface); }
.empty { margin: 0; color: var(--muted); }
.note { font-size: 13px; color: var(--muted); margin: 0; }

/* tab bar */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.tabbar-inner { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); height: var(--tabbar-h); }
.tab { border: 0; background: transparent; display: grid; place-items: center; align-content: center; gap: 2px; font-size: 11.5px; color: var(--muted); }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--accent); font-weight: 600; }

/* decks */
.decks { display: flex; flex-direction: column; gap: 12px; }
.deck { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; display: grid; gap: 14px; box-shadow: var(--shadow); }
.deck-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.deck h3 { margin: 0; font-size: 18px; font-weight: 600; }
.deck-meta { margin: 0; font-size: 13px; color: var(--muted); }
.bar { height: 4px; background: var(--accent-soft); border-radius: 2px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.counts { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; margin: 0; }
.counts div { background: var(--sunken); border-radius: 10px; padding: 8px 12px; }
.counts dt { font-size: 12px; color: var(--muted); }
.counts dd { margin: 0; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.c-new dd { color: var(--c-new); } .c-learn dd { color: var(--c-learn); } .c-rev dd { color: var(--c-rev); }
.deck-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.confirm { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13.5px; }

/* tools */
.tools { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 560px) { .tools { grid-template-columns: 1fr; } }
.tools .panel { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.tools h2 { margin: 0; font-size: 15px; font-weight: 600; }
.tools p { margin: 0; font-size: 13px; color: var(--muted); }
#importFile, #backupFile, #gridFile { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.import-msg { font-size: 13px; }
.import-msg[data-kind="error"] { color: var(--again); }
.stepper { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 10px; padding: 3px; align-self: flex-start; }
.stepper button { width: 36px; height: 34px; border: 0; background: transparent; border-radius: 8px; font-size: 18px; }
.stepper button:hover { background: var(--accent-soft); }
.stepper output { min-width: 44px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; align-self: flex-start; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; border-radius: 8px; padding: 6px 12px; font-size: 13.5px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

/* search + chips */
.searchrow { display: flex; gap: 8px; align-items: center; }
.search { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 14px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }

/* word list */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.row { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 12px 16px; }
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--sunken); }
.row .w { font-family: var(--f-jp); font-size: 17px; font-weight: 500; }
.row .w mark { background: none; color: var(--accent); font-weight: 700; }
.row .r { font-family: var(--f-jp); font-size: 13px; color: var(--muted); margin-left: 8px; }
.row .m { font-size: 13.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .star { color: var(--star); font-size: 15px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dot.s-learn { background: var(--c-learn); } .dot.s-rev { background: var(--c-rev); } .dot.s-long { background: var(--accent); }
.more { display: flex; justify-content: center; }

/* kanji grid */
.kgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.ktile { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 6px 8px; display: grid; justify-items: center; gap: 2px; }
.ktile:hover { border-color: var(--accent); }
.ktile .k { font-family: var(--f-word); font-weight: 700; font-size: 32px; line-height: 1.15; }
.ktile .ko { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.ktile .n { font-size: 11px; color: var(--accent); font-variant-numeric: tabular-nums; }

/* word page */
.hero { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 24px; display: grid; gap: 14px; }
.hero-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.hero .word { font-family: var(--f-word); font-weight: 700; font-size: clamp(2.4rem, 8vw, 3.6rem); line-height: 1.2; overflow-wrap: anywhere; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; width: 38px; height: 38px; display: inline-grid; place-items: center; flex: none; color: var(--muted); }
.iconbtn:hover { color: var(--accent); border-color: var(--accent); }
.iconbtn[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.iconbtn svg { width: 18px; height: 18px; }
.reading { font-family: var(--f-jp); font-size: 21px; font-weight: 500; color: var(--accent); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.meaning { font-size: 18px; font-weight: 500; }
.meaning i { font-style: normal; color: var(--muted); font-size: 15px; font-weight: 400; }
.pos { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.decktag { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin-left: 6px; }
.example { background: var(--sunken); border-radius: 12px; padding: 12px 14px; display: grid; gap: 4px; }
.example .jp { font-family: var(--f-jp); font-size: 16.5px; line-height: 1.8; display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; }
.example .jp b { color: var(--accent); font-weight: 600; }
.example .ko { font-size: 14px; color: var(--muted); }
.kj { cursor: pointer; border-bottom: 1px dotted var(--muted); }
.kj:hover, .kj:focus-visible { color: var(--accent); border-bottom-color: var(--accent); }
.kbreak { display: grid; gap: 8px; }
.kitem { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 14px; align-items: center; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 14px 8px 8px; text-align: left; width: 100%; }
.kitem:hover { border-color: var(--accent); }
.kitem .k { font-family: var(--f-word); font-weight: 700; font-size: 34px; line-height: 1; display: grid; place-items: center; height: 52px; background: var(--sunken); border-radius: 8px; }
.kitem .ko { font-weight: 600; }
.kitem .sub { font-size: 12.5px; color: var(--muted); }
.kitem .kohead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.jlpt { font-size: 11px; font-weight: 700; letter-spacing: .03em; padding: 1px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.jlpt.none { background: var(--sunken); color: var(--muted); font-weight: 500; }
.jlpt.out { background: transparent; color: var(--muted); font-weight: 600; border: 1px dashed var(--line); }
.aitag { font-size: 10.5px; font-weight: 700; letter-spacing: .04em; padding: 1px 6px; border-radius: 6px; background: var(--sunken); color: var(--muted); vertical-align: middle; }
.ktile .ko.empty { color: var(--muted); font-weight: 400; }
#kaiBtn { white-space: nowrap; }
.knote { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.kitem .go { color: var(--muted); font-size: 18px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin: 0; }
.facts div { background: var(--sunken); border-radius: 10px; padding: 9px 12px; }
.facts dt { font-size: 12px; color: var(--muted); }
.facts dd { margin: 0; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }

/* kanji page */
.khero { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 22px; align-items: center; }
@media (max-width: 480px) { .khero { grid-template-columns: 1fr; justify-items: start; } }
.kbig { font-family: var(--f-word); font-weight: 700; font-size: 104px; line-height: 1; width: 148px; height: 148px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 16px; background:
  linear-gradient(var(--line), var(--line)) center/1px 100% no-repeat,
  linear-gradient(var(--line), var(--line)) center/100% 1px no-repeat, var(--sunken); }
.kko { font-size: 24px; font-weight: 600; margin: 0; }
.kchips { display: flex; gap: 6px; flex-wrap: wrap; }
.krow { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; border-bottom: 1px solid var(--line); }
.krow:last-child { border-bottom: 0; }
.krow > .row { border-bottom: 0; }
.kchips.side { justify-content: flex-end; padding: 8px 14px 8px 0; max-width: 55vw; }
@media (max-width: 560px) { .kchips.side .kchip span { display: none; } .kchips.side { gap: 4px; padding-right: 10px; } }
.kchip { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 4px 10px; display: inline-flex; gap: 6px; align-items: baseline; }
.kchip:hover { border-color: var(--accent); }
.kchip b { font-family: var(--f-word); font-size: 20px; }
.kchip span { font-size: 12px; color: var(--muted); }

/* study */
.qcounts { display: flex; gap: 12px; font-weight: 600; font-variant-numeric: tabular-nums; font-size: 15px; }
.qcounts .n { color: var(--c-new); } .qcounts .l { color: var(--c-learn); } .qcounts .r { color: var(--c-rev); }
.qcounts span[data-cur="1"] { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 2px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); min-height: 340px; padding: 28px 24px 24px; display: flex; flex-direction: column; gap: 20px; position: relative; }
.card .tag { position: absolute; top: 14px; left: 18px; font-size: 11.5px; font-weight: 600; letter-spacing: .06em; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); }
.tag.t-new { color: var(--c-new); } .tag.t-learn { color: var(--c-learn); } .tag.t-rev { color: var(--c-rev); }
.card .open { position: absolute; top: 10px; right: 12px; }
.front { flex: 1; display: grid; place-items: center; text-align: center; padding-top: 18px; min-height: 140px; gap: 10px; }
.front .word { font-family: var(--f-word); font-weight: 700; font-size: clamp(2.6rem, 9vw, 4.4rem); line-height: 1.2; letter-spacing: .02em; overflow-wrap: anywhere; }
.front .mfront { font-size: clamp(1.4rem, 5vw, 2rem); font-weight: 600; }
.front .blank { font-family: var(--f-jp); font-size: 16px; color: var(--muted); max-width: 34em; }
.html-front { font-family: var(--f-jp); font-size: clamp(1.6rem, 6vw, 2.6rem); line-height: 1.35; overflow-wrap: anywhere; }
.back { border-top: 1px dashed var(--line); padding-top: 18px; display: grid; gap: 14px; min-width: 0; }
.back .word-inline { font-family: var(--f-word); font-weight: 700; font-size: 34px; }
.html-back { font-family: var(--f-jp); font-size: 16px; line-height: 1.7; overflow-wrap: anywhere; }
.actions { display: grid; gap: 10px; }
.reveal { width: 100%; padding: 16px; font-size: 16px; justify-content: center; }
.rates { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.rate { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 6px 12px; display: grid; gap: 2px; justify-items: center; }
.rate b { font-size: 15.5px; font-weight: 600; }
.rate span { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rate kbd { font-family: var(--f-ui); font-size: 10.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.rate[data-g="1"] b { color: var(--again); } .rate[data-g="1"]:hover { border-color: var(--again); }
.rate[data-g="2"] b { color: var(--hard); }  .rate[data-g="2"]:hover { border-color: var(--hard); }
.rate[data-g="3"] b { color: var(--good); }  .rate[data-g="3"]:hover { border-color: var(--good); }
.rate[data-g="4"] b { color: var(--easy); }
.rates.two { grid-template-columns: 1fr 1fr; gap: 10px; }
.rates.two .rate { padding: 16px 8px; border-radius: 14px; }
.rates.two .rate b { font-size: 17px; }
.rates.two .rate[data-g="3"] span { color: var(--accent); }
.scard { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); padding: 18px 18px 16px; display: flex; flex-direction: column; min-height: min(68vh, 640px); }
.sc-top { display: flex; align-items: center; gap: 8px; }
.sc-top .grow { flex: 1; }
.ago { background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 13px; padding: 5px 12px; border-radius: 999px; white-space: nowrap; }
.favplain { border: 0; background: transparent; color: var(--line); width: 34px; height: 34px; display: grid; place-items: center; padding: 0; }
.favplain svg { width: 22px; height: 22px; }
.favplain[aria-pressed="true"] { color: var(--star); }
.pillbtn { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 8px 14px; display: inline-flex; gap: 6px; align-items: center; font-size: 14px; color: var(--ink); }
.pillbtn svg { width: 18px; height: 18px; }
.pillbtn.tg { color: var(--muted); }
.pillbtn.tg[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }

(() => {
  // ================= FSRS-5 =================
  const W = [0.40255,1.18385,3.173,15.69105,7.1949,0.5345,1.4604,0.0046,1.54575,0.1192,1.01925,1.9395,0.11,0.29605,2.2698,0.2315,2.9898,0.51655,0.6621];
  const DECAY = -0.5, FACTOR = 19 / 81;
  const MIN = 60000, DAY = 86400000, LEARN_AHEAD = 20 * MIN;
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const R = (t, s) => Math.pow(1 + FACTOR * t / s, DECAY);
  const ivl = s => clamp(Math.round(s / FACTOR * (Math.pow(0.9, 1 / DECAY) - 1)), 1, 36500);
  const initS = g => Math.max(W[g - 1], 0.1);
  const initD = g => clamp(W[4] - Math.exp(W[5] * (g - 1)) + 1, 1, 10);
  const nextD = (d, g) => { const dp = d + (-W[6] * (g - 3)) * (10 - d) / 9; return clamp(W[7] * initD(4) + (1 - W[7]) * dp, 1, 10); };
  const recallS = (d, s, r, g) => s * (1 + Math.exp(W[8]) * (11 - d) * Math.pow(s, -W[9]) * (Math.exp((1 - r) * W[10]) - 1) * (g === 2 ? W[15] : 1) * (g === 4 ? W[16] : 1));
  const forgetS = (d, s, r) => Math.min(W[11] * Math.pow(d, -W[12]) * (Math.pow(s + 1, W[13]) - 1) * Math.exp((1 - r) * W[14]), s);
  const shortS = (s, g) => s * Math.exp(W[17] * (g - 3 + W[18]));

  function dayStart(t) { const d = new Date(t); d.setHours(4, 0, 0, 0); if (d.getTime() > t) d.setDate(d.getDate() - 1); return d.getTime(); }

  }
  // 묶이는 카드의 메모·표시·즐겨찾기·졸업·학습 기록을 대표 카드로 모은다(여러 번 해도 결과가 같음)
  function absorbInto(pk, ak, dirty) {
    // 메모·표시·즐겨찾기·졸업은 대표 카드로 옮긴다(옮긴 뒤 원래 자리는 비움 → 대표에서 지우면 다시 생기지 않음)

  }
  function statusOf(key) {
    const s = S.states[key];

  }

  // ================= queue =================
  const qKey = (c, mode) => mode === "write" ? "wr:" + c.key : c.key;
  // 뜯은 종이(예전 이름: 졸업)는 학습·복습·쓰기·랜덤 복습에 안 나오고, 가끔 '뜯은 종이 확인'으로만 나온다
  const isGrad = c => !!S.grad[c.key];
  const qCards = (deck, mode) => deck.cards.filter(c => !isGrad(c) && (mode !== "write" || writeTarget(c)));
  // 뜯기 추천: 복습 간격이 설정한 기간(기본 1달) 이상으로 길어진 단어. 뜯는 건 항상 직접.
  const TEAR_OPTS = [[14, "2주"], [30, "1달"], [60, "2달"], [90, "3달"]];
  const tearDays = () => S.settings.tearDays || 30;
  const tearLabel = () => (TEAR_OPTS.find(o => o[0] === tearDays()) || [0, tearDays() + "일"])[1];
  const gradSuggest = key => { const s = S.states[key]; return !S.grad[key] && s && s.st === "review" && (s.ivl || 0) >= tearDays(); };
  // 뜯은 종이 확인: 뜯고 3달 뒤 → 맞히면 6달 뒤 → 1년마다. 틀리면 원래 책에 다시 끼운다.
  const TEAR_CHECKS = [90, 180, 365];
  const tearCheckDue = key => { const t = S.tear[key]; return (t && t.c) || ((S.grad[key] || Date.now()) + TEAR_CHECKS[0] * DAY); };
  const tornDue = now => { const cut = nextCutoff(now); return S.cards.filter(c => isGrad(c) && tearCheckDue(c.key) < cut); };
  const saveTear = () => serial("tear", () => S.store.saveTear());
  function reinsert(key, now) {
    delete S.grad[key]; serial("grad", () => S.store.saveGrad());
    const t = Object.assign({}, S.tear[key] || {}); t.b = (t.b || 0) + 1; t.bt = now; delete t.c; t.n = 0; S.tear[key] = t; saveTear();
    const o = againState(S.states[key] || null, now); S.states[key] = o; persistState(key, o);
  }
  // 어려움 표시: p=발음(빨강), m=뜻(초록), k=한자(파랑). 종이에 긋던 밑줄처럼 해당 부분에 색 밑줄.
  const TAGS = [["p", "발음"], ["m", "뜻"], ["k", "한자"]];
  const tagOf = key => S.tags[key] || {};
  function toggleTag(key, t) {
    const o = Object.assign({}, S.tags[key] || {});
    if (o[t]) delete o[t]; else o[t] = 1;
    if (Object.keys(o).length) S.tags[key] = o; else delete S.tags[key];
    serial("tags", () => S.store.saveTags());
  }
  const ul = (html, key, t) => tagOf(key)[t] ? `<span class="ul ul-${t}">${html}</span>` : html;
  function tagButtons(key) {
    const g = tagOf(key);
    return `<div class="tagbtns" role="group" aria-label="어려움 표시">${TAGS.map(([t, l]) => `<button class="tagbtn tg-${t}" type="button" data-act="tag" data-t="${t}" data-key="${esc(key)}" aria-pressed="${!!g[t]}">${l}</button>`).join("")}</div>`;
  }
  const tagDots = key => { const g = tagOf(key); const d = TAGS.filter(([t]) => g[t]); return d.length ? `<span class="tdots">${d.map(([t, l]) => `<i class="td-${t}" title="${l}"></i>`).join("")}</span>` : ""; };
  function setGrad(key, on) {
    const now = Date.now();
    if (on) { S.grad[key] = now; const t = Object.assign({}, S.tear[key] || {}); t.c = now + TEAR_CHECKS[0] * DAY; t.n = 0; S.tear[key] = t; }
    else { delete S.grad[key]; if (S.tear[key]) { const t = Object.assign({}, S.tear[key]); delete t.c; t.n = 0; S.tear[key] = t; } }
    serial("grad", () => S.store.saveGrad()); saveTear();
  }
  function deckCounts(deck, now, mode) {
    const cut = nextCutoff(now), start = dayStart(now), cards = qCards(deck, mode);
    const limit = deck.noNew ? 0 : Infinity;
    let unseen = 0, learn = 0, rev = 0, introduced = 0, seen = 0;
    for (const c of cards) {
      const s = S.states[qKey(c, mode)];
      if (!s) { unseen++; continue; }
      seen++; if (s.first >= start) introduced++;
      if (s.st === "learning" || s.st === "relearning") { if (s.due < cut) learn++; }
      else if (s.st === "review" && s.due < cut) rev++;

  }
  function nextCard(deck, now, mode) {
    const cut = nextCutoff(now);
    let learnNow = null, review = null, ahead = null, firstNew = null, lnDue = 0, rvDue = 0, ahDue = 0;
    for (const c of qCards(deck, mode)) {
      const s = S.states[qKey(c, mode)];

        if (s.due <= now) { if (!learnNow || s.due < lnDue) { learnNow = c; lnDue = s.due; } }
        else if (s.due <= now + LEARN_AHEAD && (!ahead || s.due < ahDue)) { ahead = c; ahDue = s.due; }
      } else if (s.st === "review" && s.due < cut && (!review || s.due < rvDue)) { review = c; rvDue = s.due; }
    }
    if (learnNow) return { c: learnNow, q: "l" };
    if (review) return { c: review, q: "r" };
    if (firstNew && deckCounts(deck, now, mode).newToday > 0) return { c: firstNew, q: "n" };

  function nextLearnLater(deck, now, mode) {
    let t = null;
    for (const c of qCards(deck, mode)) { const s = S.states[qKey(c, mode)]; if (s && (s.st === "learning" || s.st === "relearning") && s.due > now && (t === null || s.due < t)) t = s.due; }
    return t;
  }

  // ================= writing target =================
  // 예문 속 단어에서 한자 부분만 가리고, 각 한자 덩어리 위에 읽기를 단다.
  const NO_WRITE = new Set(["부사", "접속사", "연체사"]);
  const isKj = ch => KANJI_RE.test(ch) || ch === "々";
  // ---- 높낮이(피치 악센트): Kanjium accents.txt (CC BY-SA 4.0) ----
  // 한 줄 = 단어 \t 읽기(가나 단어면 빈칸) \t 악센트 번호(여러 개면 쉼표, 품사 표시가 붙기도 함)
  let ACC = null, ACCR = null, ACCW = null, ACCK = null;
  async function loadAccents() {
    try {
      const txt = await fetch("accents.txt").then(r => r.ok ? r.text() : "");
      const m = new Map(), byR = new Map(), byW = new Map(), byK = new Map();
      for (const line of txt.split("\n")) {
        const [w, r, a0] = line.split("\t"); if (!w || !a0) continue;
        const a = a0.trim(), k = w + "\t" + (r || "");
        if (!m.has(k)) m.set(k, a);
        if (!m.has(w)) m.set(w, a);

        if (r && /[\u4e00-\u9fff々]/.test(w)) { const l = byW.get(r); if (l) { if (l.length < 40 && !l.includes(w)) l.push(w); } else byW.set(r, [w]); }
      }
      ACC = m; ACCR = byR; ACCW = byW; ACCK = byK;
      if (RNEED) { RNEED = false; try { rebuild(); render(); } catch (e) {} }
    } catch (e) { ACC = new Map(); ACCR = new Map(); }
  }
  function accentNums(c) {
    if (!ACC || !c || c.html) return null;
    const look = (w, r) => {
      const a = ACC.get(w + "\t" + r) || (!r || r === w ? ACC.get(w + "\t") : null) || (!kanjiOf(w).length ? (ACC.get(w) || ACCR.get(w)) : null);
      if (a) return a;
      // 「徐々に」「動揺する」처럼 뒤에 붙은 말을 떼고 한 번 더
      for (const suf of ["として", "する", "に", "と"]) if (w.length > suf.length && w.endsWith(suf)) { const x = look(w.slice(0, -suf.length), r.endsWith(suf) ? r.slice(0, -suf.length) : r); if (x) return x; }
      return null;
    };
    const raw = look((c.w || "").trim(), toHira((c.r || "").trim()));
    if (!raw) return null;
    const nums = [...new Set(raw.replace(/\([^)]*\)/g, "").split(",").map(x => x.trim()).filter(x => /^\d+$/.test(x)).map(Number))];
    return nums.length ? nums : null;

  const SMALL = "ゃゅょぁぃぅぇぉゎャュョァィゥェォヮ";

  // 읽기 위에 높낮이 선을 그린다. 0=평판, 1=두고, n=n번째 박 뒤에서 내려감
  function pitchHtml(reading, n) {
    const ms = morae(reading), len = ms.length;
    const high = i => n === 0 ? i > 0 : n === 1 ? i === 0 : (i > 0 && i < n);
    return `<span class="pitch" title="악센트 ${n}">${ms.map((m, i) => {
      const h = high(i), cls = [h ? "h" : "l"];
      if (h && i > 0 && !high(i - 1)) cls.push("up");
      if (h && ((i < len - 1 && !high(i + 1)) || (i === len - 1 && n === len && n > 0))) cls.push("dn");

  // 읽기 표시: 악센트를 알면 선 + 번호, 모르면 글자만

    const r = c.r || (!kanjiOf(c.w || "").length ? c.w : "");
    if (!r) return "";

    return pitchHtml(toHira(r) === r ? r : r, nums[0]) + (withNum ? `<span class="accnum" title="높낮이 악센트 번호">${nums.map(x => "[" + x + "]").join("")}</span>` : "");
  }

    if (WT.has(c.key)) return WT.get(c.key);

    if (!c.html && kanjiOf(c.w).length) {
      const w = c.w.replace(/\(と\)|[()]/g, "");
      const segs = [];
      for (const ch of w) {
        const k = isKj(ch), last = segs[segs.length - 1];

      let readings = null;
      if (c.r) {

  // ================= navigation =================

  const pagebar = (title, right) => `<div class="pagebar"><div class="left"><button class="btn ghost" type="button" data-act="back">← 뒤로</button><h2>${esc(title)}</h2></div>${right || ""}</div>`;

  const importMsgHtml = () => S.importMsg ? `<div class="import-msg" ${S.importMsg.kind ? `data-kind="${S.importMsg.kind}"` : ""}>${esc(S.importMsg.text)}</div>` : "";

  // ================= AI 자동 채우기 =================

      ks = ks.filter(x => q.includes(x.k) || kKo(x.i).includes(q) || (x.i.on || []).some(o => o.includes(qk)) || (x.i.kun || []).some(u => u.replace(/[().\-]/g, "").includes(q)) || (x.i.en || "").toLowerCase().includes(ql));
    }
    if (mine) ks.sort((a, b) => b.n - a.n || (a.i.freq || 9999) - (b.i.freq || 9999));
    else ks.sort((a, b) => (a.i.freq || 9999) - (b.i.freq || 9999) || a.k.localeCompare(b.k));
    const shown = ks.slice(0, S.kanjiLimit);
    const lvName = l => l === "none" ? "급수 외" : l === "out" ? "상용 외" : "N" + l;
    const label = !sel.length ? "전체 한자" : [mine ? "단어장에 쓰인" : "", KFILTERS.filter(([k]) => lvs.includes(k)).map(([k]) => lvName(k)).join("·")].filter(Boolean).join(" · ") + " 한자";
    const tile = x => {
      const meta = [x.i.jlpt ? "N" + x.i.jlpt : isOut(x.i) ? "상용 외" : "", x.n ? x.n + "단어" : ""].filter(Boolean).join(" · ");
      return `<button class="ktile" type="button" data-act="kanji" data-k="${esc(x.k)}"><span class="k" lang="ja">${esc(x.k)}</span><span class="ko${x.i.ko ? "" : " empty"}">${esc(kKo(x.i) || "—")}</span><span class="n">${meta || "&nbsp;"}</span></button>`;
    };
    const miss = ks.filter(x => kNeedsKo(x.k)).length;
    const fillBtn = miss ? (KFILL.running ? `<span class="muted">AI가 음훈을 채우는 중…</span>` : aiReady() ? `<button class="btn small" type="button" data-act="kfill-missing">음훈 빈 ${miss}자 AI로 채우기</button>` : `<span class="muted">음훈이 빈 한자 ${miss}자 · 학습 탭의 'AI 자동 채우기'에 키를 넣으면 채워져요</span>`) : "";
    return `<div class="knote"><p class="note num">${label} ${ks.length}자 · ${mine ? "단어 많은 순" : "자주 쓰이는 순"}</p>${fillBtn}</div>
      ${shown.length ? `<div class="kgrid">${shown.map(tile).join("")}</div>` : '<p class="empty">찾는 한자가 없어요.</p>'}
      ${ks.length > shown.length ? `<div class="more"><button class="btn" type="button" data-act="more-kanji">더 보기 (${ks.length - shown.length}자 남음)</button></div>` : ""}`;
  }

  // ================= view: word page =================
  function kanjiItems(c) {
    const ks = kanjiOf(c.w);
    if (!ks.length) return '<p class="note">이 단어에는 한자가 없어요.</p>';
    return `<div class="kbreak">${ks.map(k => {
      const info = S.kanji[k] || {}, n = (S.kidx.get(k) || []).length;
      const badge = (info.jlpt ? `<span class="jlpt">N${info.jlpt}</span>` : info.joyo ? '<span class="jlpt none">급수 외</span>' : kOutBadge(info)) + (S.kedits[k] && S.kedits[k].ai ? '<span class="aitag">AI</span>' : "");
      const on = info.on && info.on.length ? `<div class="sub" lang="ja">음 ${esc(info.on.slice(0, 3).join("・"))}</div>` : "";
      const kun = info.kun && info.kun.length ? `<div class="sub" lang="ja">훈 ${esc(info.kun.slice(0, 3).join("・"))}</div>` : "";
      return `<button class="kitem" type="button" data-act="kanji" data-k="${esc(k)}"><span class="k" lang="ja">${esc(k)}</span><span style="min-width:0"><div class="kohead"><span class="ko">${esc(kKo(info) || "음훈 정보 없음")}</span>${badge}</div>${on}${kun}${on || kun ? "" : `<div class="sub">이 한자가 들어간 단어 ${n}개</div>`}</span><span class="go" aria-hidden="true">›</span></button>`;
    }).join("")}</div>`;
  }
  function noteOf(key) { return S.notes[key] || {}; }
  // ===== 메모 속 단어 연결 =====
  // 메모에 단어장의 다른 단어(한자가 들어간 2글자 이상, 또는 「」로 감싼 단어)가 나오면 점선으로 이어 주고,
  // 그 단어 쪽에서도 "다른 단어 메모에서"로 메모를 함께 보여 준다. 연결은 저장하지 않고 그때그때 찾는다.
  let MENT = null; // { byFirst: Map(첫 글자 → [표기…]), spell: Map(표기 → 대표 키), back: {키: [메모 쓴 키…]} }
  const mentionReset = () => { MENT = null; };
  function mentionIndex() {
    if (MENT) return MENT;
    const spell = new Map(), byFirst = new Map();
    const all = new Set(); for (const c of S.cards) { if (c.html || !c.w) continue; all.add(c); for (const a of c.alts || []) all.add(a); }
    for (const c of all) { const w = c.w.trim(), pk = (S.byKey[c.key] || c).key; if (!w || spell.has(w)) continue; spell.set(w, pk); }
    for (const w of spell.keys()) { if (!(kanjiOf(w).length && w.length >= 2)) continue; const f = w[0]; if (!byFirst.has(f)) byFirst.set(f, []); byFirst.get(f).push(w); }
    for (const l of byFirst.values()) l.sort((a, b) => b.length - a.length);
    MENT = { spell, byFirst, back: {} };
    for (const [k, n] of Object.entries(S.notes || {})) {
      if (!n || !n.memo || !S.byKey[k]) continue; const src = S.byKey[k].key;
      for (const seg of mentionSplit(n.memo)) if (seg.key && seg.key !== src) { const b = MENT.back[seg.key] || (MENT.back[seg.key] = []); if (!b.includes(src)) b.push(src); }
    }
    return MENT;
  }
  // 메모 글을 [{t, key?}] 조각으로 나눈다
  function mentionSplit(text) {
    const M = MENT || mentionIndex(), out = []; let buf = "", i = 0;
    const push = (t, key) => { if (buf) { out.push({ t: buf }); buf = ""; } out.push({ t, key }); };
    while (i < text.length) {
      const ch = text[i];
      if (ch === "「") { const j = text.indexOf("」", i + 1); if (j > i + 1 && j - i < 30) { const inner = text.slice(i + 1, j).trim(); if (M.spell.has(inner)) { buf += "「"; push(inner, M.spell.get(inner)); buf += "」"; i = j + 1; continue; } } }
      const cands = M.byFirst.get(ch);
      if (cands) { const w = cands.find(x => text.startsWith(x, i)); if (w) { push(w, M.spell.get(w)); i += w.length; continue; } }
      buf += ch; i++;
    }
    if (buf) out.push({ t: buf });
    return out;
  }
  // 메모를 HTML로: 다른 단어는 점선 버튼(누르면 그 단어로), 지금 단어는 굵게
  function memoHtml(text, selfKey) {
    return mentionSplit(String(text || "")).map(sg => !sg.key ? esc(sg.t) : sg.key === selfKey ? `<b class="mself" lang="ja">${esc(sg.t)}</b>` : `<button class="mention" type="button" lang="ja" data-act="word" data-key="${esc(sg.key)}">${esc(sg.t)}</button>`).join("");
  }
  // 자기 메모가 있거나, 다른 단어 메모에 나온 단어
  const hasMemo = c => !!(noteOf(c.key).memo || "").trim() || backlinksOf(c.key).length > 0;
  const backlinksOf = key => (mentionIndex().back[key] || []).filter(k => S.byKey[k] && (noteOf(k).memo || "").trim());
  // 다른 단어에서 쓴 메모(주인은 그 단어). 이름표 + 그 단어에서 고치기 버튼
  function backlinksHtml(key, withEdit) {
    const list = backlinksOf(key); if (!list.length) return "";
    return list.map(k => { const c = S.byKey[k]; return `<div class="bm"><div class="bmhead"><button class="bmw" type="button" data-act="word" data-key="${esc(k)}" lang="ja">${esc(c.w)}</button><span class="muted"> 메모</span>${withEdit ? `<button class="btn small ghost" type="button" data-act="note-edit-at" data-key="${esc(k)}">✎ ${esc(c.w)}에서 고치기</button>` : ""}</div><div class="txt">${memoHtml(noteOf(k).memo, key)}</div></div>`; }).join("");
  }
  // 공부 카드: 메모가 있으면 뜻 보기 후 노란 메모 버튼, 누르면 펼침
  function memoToggleHtml(sess, key) {
    const m = (noteOf(key).memo || "").trim(), bl = backlinksOf(key); if (!m && !bl.length) return "";
    const open = sess.memoKey === key;
    return `<button class="memobtn" type="button" data-act="tg-memo" aria-pressed="${open}">✎ 메모${!m ? " (다른 단어)" : bl.length ? ` +${bl.length}` : ""}${open ? " 접기" : ""}</button>${open ? `<div class="mymean">${m ? `<div class="txt">${memoHtml(m, key)}</div>` : ""}${backlinksHtml(key, false)}</div>` : ""}`;
  }
  // 예전 '내가 추가한 뜻'(extra)은 메모 맨 앞으로 옮기고 없앤다. 바뀐 게 있으면 true.
  function migrateNotes() {
    let changed = false;
    for (const [k, n] of Object.entries(S.notes || {})) {
      if (!n || !("extra" in n)) continue;
      const ex = (n.extra || "").trim(), memo = (n.memo || "").trim();
      const merged = ex ? ("뜻 추가: " + ex + (memo ? "\n" + memo : "")) : memo;
      if (merged) S.notes[k] = { memo: merged, at: n.at || Date.now() }; else delete S.notes[k];
      changed = true;
    }
    return changed;
  }
  function noteSection(page, c) {
    const n = noteOf(c.key);
    if (page.editNote) {
      return `<section><h2 class="section-title">메모 편집</h2>
        <div class="panel noteedit">
          <div class="field"><label for="n_memo">메모</label><textarea id="n_memo" placeholder="추가 뜻, 외우는 요령, 헷갈리는 단어, 들었던 문장 등을 자유롭게 적어 두세요. 공부 카드에서 뜻 보기를 누르면 볼 수 있어요.">${esc(n.memo || "")}</textarea></div>
          <div class="formactions"><button class="btn primary" type="button" data-act="note-save">저장</button><button class="btn ghost" type="button" data-act="note-cancel">취소</button></div>
        </div></section>`;
    }
    const memo = (n.memo || "").trim();
    return `<section><div class="pagebar" style="margin-bottom:10px"><h2 class="section-title" style="margin:0">메모</h2><button class="btn small" type="button" data-act="note-edit">✎ ${backlinksOf(c.key).length ? (memo ? "이 단어 메모 편집" : "이 단어 메모 쓰기") : "메모 편집"}</button></div>
      ${memo || backlinksOf(c.key).length ? `<div class="memo">${memo ? `<div class="txt">${memoHtml(memo, c.key)}</div>` : ""}${backlinksHtml(c.key, true)}</div>` : '<p class="note">아직 메모가 없어요. 위 버튼을 눌러 이 단어만의 메모를 적어 보세요. 다른 단어(한자 단어, 또는 「あいにく」처럼 「」로 감싼 단어)를 적으면 그 단어에서도 이 메모가 보여요.</p>'}
    </section>`;
  }
  function saveNote(key) {
    const memo = ($("#n_memo") || {}).value || "";
    if (memo.trim()) S.notes[key] = { memo: memo.trim(), at: Date.now() };
    else delete S.notes[key];
    serial("notes", () => S.store.saveNotes()); mentionReset();
  }
  function recordFacts(key) {
    const s = S.states[key], now = Date.now();
    if (!s) return '<p class="note">아직 공부하지 않은 단어예요. 덱에서 공부하기를 누르면 순서대로 나와요.</p>';
    const st = statusOf(key);
    let due;
    if (s.st === "review") { const d = new Date(s.due); due = (d.getMonth() + 1) + "월 " + d.getDate() + "일"; }
    else due = s.due <= now ? "지금" : fmtNext(s, now) + " 뒤";
    const r = s.st === "review" ? Math.round(R(Math.max(0, (now - s.last) / DAY), s.s) * 100) + "%" : "—";
    return `<dl class="facts">
      <div><dt>상태</dt><dd>${st.label}</dd></div>
      <div><dt>다음 복습</dt><dd>${due}</dd></div>
      <div><dt>현재 기억 확률</dt><dd>${r}</dd></div>
      <div><dt>기억 안정도</dt><dd>${s.s >= 1 ? fmtDays(Math.round(s.s)) : "1일 미만"}</dd></div>
      <div><dt>복습 횟수</dt><dd>${s.reps || 0}회</dd></div>
      <div><dt>잊은 횟수</dt><dd>${s.lapses || 0}회</dd></div>
    </dl>`;
  }
  function statusChips(key) {
    const s = S.states[key], st = statusOf(key), now = Date.now();
    let next = "", q = "";
    if (s) {
      if (s.due < nextCutoff(now)) next = "오늘 복습";
      else { const d = Math.round((dayStart(s.due) - dayStart(now)) / DAY); next = d + "일 후 복습"; }
      q = s.due < nextCutoff(now) ? `<button class="wchip" type="button" disabled>오늘 복습 예정</button>` : `<button class="wchip" type="button" data-act="queue" data-key="${esc(key)}">＋ 복습 대기열에 넣기</button>`;
    }
    const w = S.states["wr:" + key];
    const cnt = (s ? `<span class="wchip cnt">학습 ${s.reps || 0}회</span>` : "") + (w ? `<span class="wchip cnt">쓰기 ${w.reps || 0}회</span>` : "");
    if (S.grad[key]) return `<div class="wchips">${cnt}<span class="wchip grad">✂ 뜯은 종이 · ${ymd(S.grad[key])}</span><button class="wchip" type="button" data-act="grad-off" data-key="${esc(key)}">↩ 책에 다시 끼우기</button></div>
      <p class="note">책에서 뜯어낸 단어라 평소 공부엔 안 나와요. 다음 확인은 ${ymd(tearCheckDue(key))}이에요. 다시 끼우면 원래 복습 일정대로 나와요.</p>`;
    const sug = gradSuggest(key);
    const gbtn = `<button class="wchip gradbtn${sug ? " sug" : ""}" type="button" data-act="grad-on" data-key="${esc(key)}">✂ ${sug ? "뜯을까요?" : "책에서 뜯기"}</button>`;
    return `<div class="wchips">${cnt}<span class="wchip ${st.cls}">● ${st.label}</span>${next ? `<span class="wchip">${next}</span>` : ""}${q}${gbtn}</div>`;
  }
  function simSection(page, c) {

        <span class="m">${esc(x.c.ko)}</span>
        <span class="why">${esc(x.why)} · ${esc(levelLabel(cardLevel(x.c)))} · ${esc(srcName(x.c))}</span>

      ${list.length > shown.length ? `<button class="btn small ghost" type="button" data-act="sim-all" style="margin-top:8px">${list.length - shown.length}개 더 보기</button>` : ""}</section>`;
  }
  function viewWord(page) {

        <div class="hero-top"><div class="word" lang="ja">${ul(linkText(c.w), c.key, "k")}${naSuf(c)}</div><div style="display:flex;gap:6px">${speakBtn(c.r || c.w, null, c.key, "w")}${favBtn}</div></div>

    </div>`;
  }

  // ================= view: kanji page =================
  function viewKanjiPage(page) {
    const k = page.k, info = S.kanji[k] || {}, keys = S.kidx.get(k) || [];
    const cards = keys.map(key => S.byKey[key]).filter(Boolean);

    const hasDetail = (info.on && info.on.length) || (info.kun && info.kun.length) || info.strokes;
    let knote = "";
    if (!info.ko) knote = KFILL.running && KFILL.list.includes(k) ? '<p class="note">AI가 음훈을 채우는 중이에요…</p>'
      : `<div class="knote"><p class="note">${info.kh ? "한글 음만 있고 뜻이 없어요." : "한국어 음훈이 없어요."}</p>${aiReady() ? `<button class="btn small" type="button" data-act="kfill-one" data-k="${esc(k)}">AI로 채우기</button>` : ""}<button class="btn small ghost" type="button" data-act="kedit" data-k="${esc(k)}">직접 입력</button></div>`;
    else if (ed && ed.ai) knote = `<div class="knote"><p class="note"><span class="aitag">AI</span> AI가 쓴 음훈이에요. 맞으면 확인을 눌러 주세요.</p><button class="btn small" type="button" data-act="kai-ok" data-k="${esc(k)}">맞아요</button><button class="btn small ghost" type="button" data-act="kedit" data-k="${esc(k)}">고치기</button></div>`;
    else if (ed) knote = '<p class="note">직접 고친 내용이 보이고 있어요. 편집에서 원래대로 되돌릴 수 있어요.</p>';
    else if (!hasDetail) knote = '<p class="note">이 한자의 읽기 정보가 없어요.</p>';
    const tab = kdTabOf(info);
    let list = kdList(tab, !!S.settings.kdMine); if (!list.some(x => x.k === k)) list = kdList(tab, false);
    const at = list.findIndex(x => x.k === k), prev = at > 0 ? list[at - 1].k : "", next = at >= 0 && at < list.length - 1 ? list[at + 1].k : "";
    const fly = page.fly, open = page.open, turn = page.turn; page.fly = false; page.open = false; page.turn = "";

    }
    const p = parseImport(t, filename);
    return { name: p.name, rows: p.rows, kind: "html" };
  }
  $("#importFile").addEventListener("change", async e => {
    const file = e.target.files && e.target.files[0]; e.target.value = "";
    if (!file) return;
    const say = (text, kind) => { S.importMsg = { text, kind }; render(); };
    if (!S.ready) return say("기록을 불러온 뒤에 다시 시도해 주세요.", "error");
    const page = topPage();
    if (!page || page.t !== "import") { S.stack = []; S.tab = "words"; S.stack.push({ t: "import" }); }
    try {
      const r = readDeckFile(await file.text(), file.name);
      if (r.error) { S.pendingImport = null; return say(r.error, "error"); }
      if (!r.rows.length) { S.pendingImport = null; return say("단어로 읽을 줄을 찾지 못했어요. 파일 내용을 확인해 주세요.", "error"); }
      if (r.rows.length > 5000) { S.pendingImport = null; return say("한 번에 5,000개까지 가져올 수 있어요. 파일을 나눠서 가져와 주세요.", "error"); }
      const dups = exactDupCount(r.rows, r.kind);
      S.importMsg = null;
      S.pendingImport = { file: file.name, name: r.name, rows: r.rows, kind: r.kind, id: r.id, level: r.level ? String(r.level) : "mine", dups, skip: dups > 0 };
      render();
    } catch (err) {
      S.pendingImport = null; say("파일을 읽지 못했어요. 형식을 확인한 뒤 다시 시도해 주세요.", "error");
    }
  });

  // ================= backup =================
  async function exportBackup() {
    const data = { format: "fsrs-backup", version: 1, exportedAt: Date.now(), states: S.states, settings: S.settings, words: S.words, favs: S.favs, grad: S.grad, tags: S.tags, days: S.days, notes: S.notes, levels: S.levels, links: S.links, exs: S.exs, kedits: S.kedits, dates: S.dates, tear: S.tear, decks: importedMetas };
    const name = "나만의단어장-백업-" + dayKey(Date.now()) + ".json";
    const blob = new Blob([JSON.stringify(data)], { type: "application/json" });
    try {
      const file = new File([blob], name, { type: "application/json" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file] });
        return;
      }
    } catch (e) {
      if (e && e.name === "AbortError") return;
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  }
  // ================= 백업 가져오기: 미리 보고 [합치기 | 덮어쓰기] =================
  const rowId = (m, r) => m.kind === "words" ? toHira(String(r[0] || "").trim()) + "|" + toHira(String(r[1] || "").trim()) : JSON.stringify(r);
  const wordId = w => toHira(String(w.w || "").trim()) + "|" + toHira(String(w.r || "").trim());
  // 파일 속 단어를 '출처 + 단어 + 읽기'로 비교한다
  function backupPlan(j) {
    const fileDecks = Array.isArray(j.decks) ? j.decks : [], fileWords = Array.isArray(j.words) ? j.words : [];
    const cur = new Map(), inc = new Map();
    const srcKey = (id, name) => "d:" + (name || id);
    for (const m of importedMetas) (m.rows || []).forEach((r, i) => cur.set(srcKey(m.id, m.name) + "|" + rowId(m, r), { w: m.kind === "words" ? r[0] : htmlText(r[0]), r: m.kind === "words" ? r[1] : "", src: m.name }));
    for (const w of S.words) cur.set("mine|" + wordId(w), { w: w.w, r: w.r, src: "직접 추가" });
    for (const m of fileDecks) (m.rows || []).forEach((r, i) => inc.set(srcKey(m.id, m.name) + "|" + rowId(m, r), { w: m.kind === "words" ? r[0] : htmlText(r[0]), r: m.kind === "words" ? r[1] : "", src: m.name }));
    for (const w of fileWords) inc.set("mine|" + wordId(w), { w: w.w, r: w.r, src: "직접 추가" });
    const added = [], same = [], gone = [];
    for (const [k, v] of inc) (cur.has(k) ? same : added).push(v);
    for (const [k, v] of cur) if (!inc.has(k)) gone.push(v);
    return { added, same, gone, total: inc.size };
  }
  function mergeBackup(j) {
    const map = new Map(); // 파일 쪽 카드 키 → 이 기기 카드 키
    for (const m of (Array.isArray(j.decks) ? j.decks : [])) {
      const here = importedMetas.find(x => x.id === m.id) || importedMetas.find(x => x.name === m.name && x.kind === m.kind);
      if (!here) { const copy = JSON.parse(JSON.stringify(m)); importedMetas.push(copy); (m.rows || []).forEach((r, i) => map.set(m.id + "-" + i, copy.id + "-" + i)); continue; }
      const idx = new Map(); (here.rows || []).forEach((r, i) => idx.set(rowId(here, r), i));
      (m.rows || []).forEach((r, i) => {
        const id = rowId(m, r);
        if (idx.has(id)) map.set(m.id + "-" + i, here.id + "-" + idx.get(id));
        else { here.rows.push(r); const ni = here.rows.length - 1; idx.set(id, ni); map.set(m.id + "-" + i, here.id + "-" + ni); }
      });
      here.count = here.rows.length;
    }
    for (const w of (Array.isArray(j.words) ? j.words : [])) {
      const byId = S.words.find(x => x.id === w.id), byWr = S.words.find(x => wordId(x) === wordId(w));
      const t = byId || byWr;
      if (t) map.set("w-" + w.id, "w-" + t.id); else { S.words.push(JSON.parse(JSON.stringify(w))); map.set("w-" + w.id, "w-" + w.id); }
    }
    const mk = k => { const wr = k.startsWith("wr:"); const base = wr ? k.slice(3) : k; const to = map.get(base) || base; return (wr ? "wr:" : "") + to; };
    for (const [k, v] of Object.entries(j.states || {})) { const t = mk(k), h = S.states[t]; if (!h || (v && (v.last || 0) > (h.last || 0))) S.states[t] = v; }
    for (const [k, v] of Object.entries(j.notes || {})) { const t = mk(k), h = S.notes[t]; if (!h) S.notes[t] = v; else if (v && v.memo && h.memo !== v.memo && !String(h.memo || "").includes(v.memo)) S.notes[t] = { memo: ((h.memo || "") + "\n" + v.memo).trim(), at: Math.max(h.at || 0, v.at || 0) }; }
    for (const name of ["favs", "grad", "levels"]) for (const [k, v] of Object.entries(j[name] || {})) { const t = mk(k); if (!(t in S[name])) S[name][t] = v; }
    for (const [k, v] of Object.entries(j.tags || {})) { const t = mk(k); S.tags[t] = Object.assign({}, S.tags[t] || {}, v || {}); }
    for (const [k, v] of Object.entries(j.links || {})) S.links[mk(k)] = mk(v);
    for (const [k, v] of Object.entries(j.dates || {})) { const t = mk(k), o = S.dates[t] || {}, as = [o.a, v && v.a].filter(Boolean); S.dates[t] = { a: as.length ? Math.min(...as) : 0, u: Math.max(o.u || 0, (v && v.u) || 0) }; }
    for (const [k, v] of Object.entries(j.tear || {})) { if (!v) continue; const t = mk(k), o = S.tear[t]; S.tear[t] = o ? { c: Math.max(o.c || 0, v.c || 0) || undefined, n: Math.max(o.n || 0, v.n || 0), b: Math.max(o.b || 0, v.b || 0), bt: Math.max(o.bt || 0, v.bt || 0) || undefined } : v; }
    for (const [k, v] of Object.entries(j.exs || {})) { const t = mk(k), have = S.exs[t] || []; for (const e of v || []) if (e && e.ex && !have.some(h => h.ex === e.ex)) have.push(e); if (have.length) S.exs[t] = have; }
    for (const [k, v] of Object.entries(j.kedits || {})) { const h = S.kedits[k]; if (v && (!h || (v.at || 0) > (h.at || 0))) S.kedits[k] = v; }
    for (const [k, v] of Object.entries(j.days || {})) { const h = S.days[k] || {}; S.days[k] = { rev: Math.max(h.rev || 0, (v || {}).rev || 0), new: Math.max(h.new || 0, (v || {}).new || 0) }; }
    migrateNotes();
  }
  function overwriteBackup(j) {
    S.states = j.states || {}; S.words = j.words || []; S.favs = j.favs || {}; S.grad = j.grad || {}; S.tags = j.tags || {}; S.days = j.days || {}; S.notes = j.notes || {}; S.levels = j.levels || {}; S.links = j.links || {}; S.exs = j.exs || {}; S.kedits = j.kedits || {}; S.dates = j.dates || {}; S.tear = j.tear || {}; migrateNotes();
    importedMetas = Array.isArray(j.decks) ? j.decks : [];
    applySettings(j.settings);
  }
  let pendingBackup = null;
  function showBackupPreview(j) {
    pendingBackup = j;
    const pl = backupPlan(j), when = j.exportedAt ? new Date(j.exportedAt).toLocaleString("ko-KR") : "";
    const list = (arr, n = 30) => arr.length ? `<ul class="blist">${arr.slice(0, n).map(v => `<li><b lang="ja">${esc(v.w || "")}</b>${v.r ? ` <span lang="ja" class="muted">${esc(v.r)}</span>` : ""} <span class="muted">· ${esc(v.src || "")}</span></li>`).join("")}${arr.length > n ? `<li class="muted">… 외 ${arr.length - n}개</li>` : ""}</ul>` : "";
    openModal(`<h3>백업 가져오기</h3>
      <p class="note">${when ? `${esc(when)}에 내보낸 파일 · ` : ""}단어 ${pl.total}개</p>
      <div class="bstats"><div><b class="num">${pl.added.length}</b><span>새 단어</span></div><div><b class="num">${pl.same.length}</b><span>이미 있음</span></div><div class="${pl.gone.length ? "warn" : ""}"><b class="num">${pl.gone.length}</b><span>이 기기에만 있음</span></div></div>
      <p class="note"><b>합치기</b>: 이 기기 단어는 그대로 두고 새 단어만 더해요. 겹치는 단어는 더 최근 공부 기록을 남기고, 메모·표시는 양쪽 다 살려요.<br><b>덮어쓰기</b>: 이 기기 기록을 파일 내용으로 통째로 바꿔요.${pl.gone.length ? ` <b class="warnt">이 기기에만 있는 단어 ${pl.gone.length}개가 사라져요.</b>` : ""}</p>
      ${pl.added.length ? `<details><summary>새로 들어올 단어 ${pl.added.length}개</summary>${list(pl.added)}</details>` : ""}
      ${pl.gone.length ? `<details ${pl.gone.length <= 30 ? "open" : ""}><summary class="warnt">덮어쓰면 사라질 단어 ${pl.gone.length}개</summary>${list(pl.gone)}</details>` : ""}
      <div class="formactions"><button class="btn primary" type="button" data-act="bk-merge">합치기</button><button class="btn" type="button" data-act="bk-over">덮어쓰기</button><button class="btn ghost" type="button" data-act="m-close">취소</button></div>`, () => { pendingBackup = null; });
  }
  async function applyBackup(mode) {
    const j = pendingBackup; if (!j) return;
    if (mode === "over") overwriteBackup(j); else mergeBackup(j);
    pendingBackup = null; closeModal();
    S.undo = null; S.stack = []; S.study = null; S.write = null;
    kanjiRebuild(); rebuild(); await S.store.saveAll(); render(); autoKanjiSoon();
    toast(mode === "over" ? "백업 내용으로 바꿨어요." : "백업을 합쳤어요.");
  }
  $("#backupFile").addEventListener("change", async e => {
    const file = e.target.files && e.target.files[0]; e.target.value = "";
    if (!file) return;
    let j;
    try { j = JSON.parse((await file.text()).replace(/^﻿/, "")); } catch (err) { toast("백업 파일을 읽지 못했어요."); return; }
    if (!j || j.format !== "fsrs-backup") { toast("나만의 단어장 백업 파일이 아니에요."); return; }
    showBackupPreview(j);
  });

  // ================= boot =================
  async function boot() {
    render();
    // 상용한자(kanji.json) + 상용 외 한자(kanji-extra.json, KANJIDIC)를 합친다. 상용한자 쪽 내용이 우선.
    const [kj, kx] = await Promise.all(["kanji.json", "kanji-extra.json"].map(u => fetch(u).then(r => r.json()).catch(() => ({}))));
    S.kbase = kj || {};
    for (const [k, v] of Object.entries(kx || {})) { const b = S.kbase[k]; S.kbase[k] = b ? Object.assign({}, v, b) : Object.assign({ joyo: false }, v); }
    S.store = LocalStore();
    const data = await S.store.loadAll();
    S.states = data.states || {};
    applySettings(data.settings);
    importedMetas = data.decks || []; S.words = data.words || []; S.favs = data.favs || {}; S.grad = data.grad || {}; S.tags = data.tags || {}; S.days = data.days || {}; S.notes = data.notes || {}; S.levels = data.levels || {}; S.links = data.links || {}; S.exs = data.exs || {}; S.kedits = data.kedits || {}; S.dates = data.dates || {}; S.tear = data.tear || {};
    kanjiRebuild();
    if (migrateNotes()) S.store.saveNotes();
    rebuild();
    autoKanjiSoon();
    S.ready = true;
    render();
    loadAccents().then(() => { const pg = topPage(); if (!pg || !["grid", "edit", "settings"].includes(pg.t)) render(); });
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    if ("serviceWorker" in navigator) { try { navigator.serviceWorker.register("sw.js"); } catch (e) {} }
  }
  boot();
})();
</script>
</body>
